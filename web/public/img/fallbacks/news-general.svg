<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Presek general news fallback">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9e2a2b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  
  <!-- Glowing ambient light -->
  <circle cx="650" cy="380" r="380" fill="url(#glow)" filter="blur(90px)" opacity="0.45"/>
  <circle cx="250" cy="150" r="220" fill="#00f2ff" filter="blur(110px)" opacity="0.12"/>

  <!-- Glass panel border -->
  <rect x="80" y="80" width="1040" height="600" rx="28" fill="url(#plate)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Grid layout helpers -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="200" y1="80" x2="200" y2="680"/>
    <line x1="1000" y1="80" x2="1000" y2="680"/>
    <line x1="80" y1="200" x2="1120" y2="200"/>
    <line x1="80" y1="560" x2="1120" y2="560"/>
  </g>

  <!-- Editorial Text Info -->
  <text x="200" y="155" font-family="'Times New Roman', Times, serif" font-size="34" font-weight="900" letter-spacing="8" fill="#ffffff" opacity="0.8">PRESEK</text>
  <text x="200" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="850" letter-spacing="4" fill="#9e2a2b">OPŠTI PREGLED / GENERAL</text>

  <!-- Simulating editorial text blocks -->
  <rect x="200" y="270" width="460" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="200" y="300" width="530" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="200" y="330" width="370" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
  
  <rect x="200" y="400" width="420" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="200" y="430" width="490" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="200" y="460" width="280" height="8" rx="4" fill="#ffffff" opacity="0.15"/>

  <!-- Constellation Art (Right Panel) -->
  <g transform="translate(800, 360)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#glow)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    
    <circle cx="0" cy="0" r="40" fill="url(#glow)" opacity="0.8"/>
    <circle cx="0" cy="0" r="20" fill="#ffffff" opacity="0.9" style="mix-blend-mode: overlay;"/>
    
    <circle cx="-80" cy="-60" r="10" fill="#ea580c" opacity="0.7"/>
    <circle cx="90" cy="70" r="8" fill="#9e2a2b" opacity="0.8"/>
    <circle cx="40" cy="-110" r="14" fill="#00f2ff" opacity="0.6"/>
    
    <line x1="-80" y1="-60" x2="0" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="90" y1="70" x2="0" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="40" y1="-110" x2="0" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  </g>
  
  <text x="200" y="625" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="6" fill="#ffffff" opacity="0.4">PRESEK.RS</text>
  <text x="1000" y="625" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#9e2a2b" opacity="0.8">AKTIVNO</text>
</svg>