<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Presek culture news fallback">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a0512"/>
      <stop offset="50%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#0f0105"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
  </defs>
  <style>
    @media (prefers-color-scheme: light) {
      .theme-surface { filter: invert(0.92) hue-rotate(180deg) saturate(0.78) brightness(1.1); }
    }
  </style>
  <g class="theme-surface">
  <rect width="1200" height="760" fill="url(#bg)"/>
  
  <circle cx="680" cy="380" r="420" fill="url(#glow)" filter="blur(72px)" opacity="0.28"/>
  <circle cx="220" cy="180" r="280" fill="#f97316" filter="blur(88px)" opacity="0.08"/>

  <rect x="80" y="80" width="1040" height="600" rx="10" fill="url(#plate)" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
  
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="6 8">
    <line x1="200" y1="80" x2="200" y2="680"/>
    <line x1="1000" y1="80" x2="1000" y2="680"/>
    <line x1="80" y1="200" x2="1120" y2="200"/>
    <line x1="80" y1="560" x2="1120" y2="560"/>
  </g>

  <text x="200" y="155" font-family="'Times New Roman', Times, serif" font-size="34" font-weight="900" letter-spacing="8" fill="#ffffff" opacity="0.8">PRESEK</text>
  <text x="200" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="850" letter-spacing="4" fill="#e11d48">KULTURA / CULTURE</text>

  <!-- Editorial Text lines -->
  <rect x="200" y="270" width="460" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="200" y="300" width="380" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="200" y="330" width="500" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
  
  <rect x="200" y="400" width="430" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="200" y="430" width="480" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="200" y="460" width="290" height="8" rx="4" fill="#ffffff" opacity="0.15"/>

  <!-- Elegant abstract waves & overlapping curved vectors -->
  <g transform="translate(800, 360)">
    <path d="M-130 60 C -70 -60, -30 100, 0 0 C 30 -100, 70 60, 130 -60" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-130 10 C -70 -110, -30 50, 0 -50 C 30 -150, 70 10, 130 -110" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" stroke-linecap="round"/>
    <path d="M-130 110 C -70 -10, -30 150, 0 50 C 30 -50, 70 110, 130 -10" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Overlapping art glass sphere -->
    <circle cx="0" cy="0" r="60" fill="url(#glow)" opacity="0.4"/>
    <circle cx="20" cy="-20" r="30" fill="#f97316" opacity="0.6" filter="blur(1px)"/>
    <circle cx="20" cy="-20" r="10" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <text x="200" y="625" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="6" fill="#ffffff" opacity="0.4">PRESEK.RS</text>
  <text x="1000" y="625" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#e11d48" opacity="0.72">KULTURNI PREGLED</text>
  </g>
</svg>
