<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Presek economy news fallback">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#115e59" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  
  <circle cx="650" cy="380" r="390" fill="url(#glow)" filter="blur(90px)" opacity="0.4"/>
  <circle cx="200" cy="160" r="260" fill="#10b981" filter="blur(110px)" opacity="0.15"/>

  <rect x="80" y="80" width="1040" height="600" rx="28" fill="url(#plate)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="200" y1="80" x2="200" y2="680"/>
    <line x1="1000" y1="80" x2="1000" y2="680"/>
    <line x1="80" y1="200" x2="1120" y2="200"/>
    <line x1="80" y1="560" x2="1120" y2="560"/>
  </g>

  <text x="200" y="155" font-family="'Times New Roman', Times, serif" font-size="34" font-weight="900" letter-spacing="8" fill="#ffffff" opacity="0.8">PRESEK</text>
  <text x="200" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="850" letter-spacing="4" fill="#10b981">EKONOMIJA / ECONOMY</text>

  <!-- Editorial Text lines -->
  <rect x="200" y="270" width="410" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="200" y="300" width="530" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="200" y="330" width="450" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
  
  <rect x="200" y="400" width="380" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="200" y="430" width="490" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="200" y="460" width="310" height="8" rx="4" fill="#ffffff" opacity="0.15"/>

  <!-- Financial charts abstract vectors -->
  <g transform="translate(740, 200)">
    <!-- Upward Trend Chart -->
    <path d="M20 280 L100 200 L180 230 L260 120 L340 70" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 280 L100 200 L180 230 L260 120 L340 70 L340 280 L20 280 Z" fill="url(#glow)" opacity="0.15" stroke="none"/>
    
    <!-- Dotted Grid lines -->
    <line x1="20" y1="280" x2="340" y2="280" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="20" y1="200" x2="340" y2="200" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="20" y1="120" x2="340" y2="120" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Glowing tip -->
    <circle cx="340" cy="70" r="16" fill="#10b981" opacity="0.75" filter="blur(2px)"/>
    <circle cx="340" cy="70" r="6" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <text x="200" y="625" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="6" fill="#ffffff" opacity="0.4">PRESEK.RS</text>
  <text x="1000" y="625" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#10b981" opacity="0.8">TRŽIŠNI SIGNAL</text>
</svg>