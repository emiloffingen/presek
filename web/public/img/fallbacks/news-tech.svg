<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Presek tech news fallback">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120224"/>
      <stop offset="50%" stop-color="#1e0b3c"/>
      <stop offset="100%" stop-color="#02000a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a21caf" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  
  <circle cx="680" cy="380" r="400" fill="url(#glow)" filter="blur(95px)" opacity="0.5"/>
  <circle cx="220" cy="180" r="260" fill="#00f2ff" filter="blur(110px)" opacity="0.15"/>

  <rect x="80" y="80" width="1040" height="600" rx="28" fill="url(#plate)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="200" y1="80" x2="200" y2="680"/>
    <line x1="1000" y1="80" x2="1000" y2="680"/>
    <line x1="80" y1="200" x2="1120" y2="200"/>
    <line x1="80" y1="560" x2="1120" y2="560"/>
  </g>

  <text x="200" y="155" font-family="'Times New Roman', Times, serif" font-size="34" font-weight="900" letter-spacing="8" fill="#ffffff" opacity="0.8">PRESEK</text>
  <text x="200" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="850" letter-spacing="4" fill="#a21caf">TEHNOLOGIJA / TECH</text>

  <!-- Editorial Text lines -->
  <rect x="200" y="270" width="460" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="200" y="300" width="530" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="200" y="330" width="370" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
  
  <rect x="200" y="400" width="420" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="200" y="430" width="490" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="200" y="460" width="280" height="8" rx="4" fill="#ffffff" opacity="0.15"/>

  <!-- High-tech abstract matrix constellation -->
  <g transform="translate(800, 360)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#glow)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="-100" y="-100" width="200" height="200" rx="16" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
    
    <!-- Constellation digital nodes -->
    <circle cx="0" cy="0" r="30" fill="url(#glow)" opacity="0.85"/>
    <circle cx="-60" cy="-60" r="10" fill="#a21caf" opacity="0.8"/>
    <circle cx="60" cy="60" r="8" fill="#00f2ff" opacity="0.8"/>
    <circle cx="70" cy="-50" r="12" fill="#0369a1" opacity="0.6"/>
    <circle cx="-80" cy="40" r="14" fill="#ec4899" opacity="0.7"/>
    
    <!-- Connectors -->
    <line x1="-60" y1="-60" x2="0" y2="0" stroke="rgba(0,242,255,0.3)" stroke-width="1.5"/>
    <line x1="60" y1="60" x2="0" y2="0" stroke="rgba(0,242,255,0.3)" stroke-width="1.5"/>
    <line x1="70" y1="-50" x2="0" y2="0" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="-80" y1="40" x2="0" y2="0" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="-60" y1="-60" x2="-80" y2="40" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="70" y1="-50" x2="60" y2="60" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>
  
  <text x="200" y="625" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="6" fill="#ffffff" opacity="0.4">PRESEK.RS</text>
  <text x="1000" y="625" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#a21caf" opacity="0.8">DIGITALNA SINTEZA</text>
</svg>