<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Presek sport news fallback">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="50%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  
  <circle cx="680" cy="380" r="410" fill="url(#glow)" filter="blur(95px)" opacity="0.45"/>
  <circle cx="240" cy="180" r="240" fill="#ea580c" filter="blur(110px)" opacity="0.12"/>

  <rect x="80" y="80" width="1040" height="600" rx="28" fill="url(#plate)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="200" y1="80" x2="200" y2="680"/>
    <line x1="1000" y1="80" x2="1000" y2="680"/>
    <line x1="80" y1="200" x2="1120" y2="200"/>
    <line x1="80" y1="560" x2="1120" y2="560"/>
  </g>

  <text x="200" y="155" font-family="'Times New Roman', Times, serif" font-size="34" font-weight="900" letter-spacing="8" fill="#ffffff" opacity="0.8">PRESEK</text>
  <text x="200" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="850" letter-spacing="4" fill="#ea580c">SPORT / SPORTS</text>

  <!-- Editorial Text lines -->
  <rect x="200" y="270" width="460" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="200" y="300" width="500" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="200" y="330" width="320" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
  
  <rect x="200" y="400" width="400" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="200" y="430" width="470" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="200" y="460" width="260" height="8" rx="4" fill="#ffffff" opacity="0.15"/>

  <!-- Stadium tracks & speed vector dynamic abstract art -->
  <g transform="translate(800, 360)">
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="170" ry="100" fill="none" stroke="url(#glow)" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="200" ry="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Dynamic diagonal speed line -->
    <line x1="-180" y1="100" x2="180" y2="-100" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
    <line x1="-120" y1="70" x2="120" y2="-70" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    
    <!-- Glowing dynamic cores -->
    <circle cx="0" cy="0" r="30" fill="url(#glow)" opacity="0.8"/>
    <circle cx="120" cy="-70" r="12" fill="#ea580c" opacity="0.75" filter="blur(2px)"/>
    <circle cx="120" cy="-70" r="5" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <text x="200" y="625" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="6" fill="#ffffff" opacity="0.4">PRESEK.RS</text>
  <text x="1000" y="625" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ea580c" opacity="0.8">LIVESCORE STRIP</text>
</svg>