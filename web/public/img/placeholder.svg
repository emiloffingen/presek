<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dee2e6" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <g transform="translate(400, 225)" opacity="0.1">
    <path d="M-60,-40 L60,-40 L60,40 L-60,40 Z" fill="#343a40" />
    <path d="M-40,-20 L40,-20" stroke="#fff" stroke-width="4" />
    <path d="M-40,0 L20,0" stroke="#fff" stroke-width="4" />
    <path d="M-40,20 L0,20" stroke="#fff" stroke-width="4" />
  </g>
  
  <text x="50%" y="90%" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#adb5bd" font-weight="600" letter-spacing="0.1em">ПРЕСЕК МЕДИУМ</text>
</svg>
