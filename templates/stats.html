<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статистики | Пресек</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans:wght@400;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Dark Mode (Default) */
      --color-bg-base: #141618;
      --color-bg-surface: #1A1C1E;
      --color-bg-surface-hover: #232629;
      --color-text-primary: #E0E2E4;
      --color-text-secondary: #8C8E90;
      --color-ruby: #D10047;
      --color-bronze: #8C6D3E;
      --color-gold: #D4AF37;
      --border-opacity: 0.2;
      --pattern-opacity: 0.03;
      --logo-gradient: linear-gradient(to right, #fff, var(--color-gold));

      --bg: var(--color-bg-base);
      --bg-card: var(--color-bg-surface);
      --border: rgba(140, 109, 62, var(--border-opacity));
      --accent: var(--color-ruby);
      --gold: var(--color-gold);
      --bronze: var(--color-bronze);
      --headline: #FFFFFF;
      --text-body: var(--color-text-primary);
      --text-muted: var(--color-text-secondary);
      
      --serif: 'Source Serif 4', Georgia, serif;
      --display: 'Playfair Display', Georgia, serif;
      --sans: 'Noto Sans', sans-serif;
      --layout-max-width: 1280px;
    }

    @media(prefers-color-scheme: light) {
      :root {
        --color-bg-base: #F0F2F3;
        --color-bg-surface: #FFFFFF;
        --color-bg-surface-hover: #E8EAEB;
        --color-text-primary: #1A1C1E;
        --color-text-secondary: #5C5E60;
        --border-opacity: 0.4;
        --pattern-opacity: 0.05;
        --logo-gradient: linear-gradient(to right, var(--color-ruby), var(--color-bronze));
        
        --bg: var(--color-bg-base);
        --bg-card: var(--color-bg-surface);
        --headline: #141618;
        --text-body: var(--color-text-primary);
        --text-muted: var(--color-text-secondary);
      }
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      --crystal-pattern: 
        linear-gradient(30deg, transparent 49%, rgba(140, 109, 62, var(--pattern-opacity)) 50%, transparent 51%),
        linear-gradient(-30deg, transparent 49%, rgba(140, 109, 62, var(--pattern-opacity)) 50%, transparent 51%);
      background: var(--bg);
      background-image: var(--crystal-pattern);
      background-size: 100px 173px;
      color:var(--text-body);
      font-family:var(--serif);
      line-height:1.6;
      min-height:100vh;
    }

    /* HEADER */
    .site-header{background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .header-inner{display:flex;align-items:center;justify-content:space-between;padding:0 20px;max-width:var(--layout-max-width);margin:0 auto;height:64px}
    .logo-text{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:1.8rem;font-weight:900;color:var(--headline);text-decoration:none;letter-spacing:-0.02em}
    .logo-text span{background:var(--logo-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .back-link{font-family:var(--sans);font-size:.875rem;font-weight:700;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:6px;transition:all .2s}

    /* CONTENT */
    .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 20px; }
    h1 { font-family: var(--display); font-size: 2.2rem; font-weight: 900; color: var(--headline); margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }

    /* KPI cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .kpi {
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 24px; text-align: center; position: relative; overflow: hidden;
    }
    .kpi::after { content:''; position:absolute; top:0; left:0; width:100%; height:2px; background:var(--accent); opacity:0.5; }
    .kpi-val { font-size: 2.2rem; font-weight: 900; color: var(--gold); line-height: 1; font-family: var(--display); margin-bottom: 8px; }
    .kpi-label { font-size: 0.75rem; color: var(--bronze); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }

    /* Two-col layout */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 32px; }
    @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }

    .panel { background: var(--bg-card); border: 1px solid var(--border); padding: 32px; position: relative; }
    .panel h2 { font-family: var(--display); font-size: 1.2rem; font-weight: 900; color: var(--headline); margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .05em; }

    /* Bar chart rows */
    .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: 0.9rem; }
    .bar-label { width: 140px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-body); font-weight: 600; }
    .bar-track { flex: 1; background: var(--bg-base); height: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--gold); transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    .bar-num { width: 50px; text-align: right; color: var(--bronze); font-weight: 700; flex-shrink: 0; }

    /* Top clicked table */
    .click-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; align-items: baseline; }
    .click-rank { width: 24px; color: var(--accent); font-weight: 900; flex-shrink: 0; }
    .click-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .click-title a { color: var(--headline); text-decoration: none; transition: color .2s; }
    .click-title a:hover { color: var(--gold); }
    .click-src { font-size: 0.75rem; color: var(--bronze); white-space: nowrap; flex-shrink: 0; font-weight: 700; text-transform: uppercase; }
    .click-n { font-weight: 900; color: var(--gold); width: 40px; text-align: right; flex-shrink: 0; }

    /* Feed status */
    .feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .feed-item { font-size: 0.8rem; padding: 12px 16px; display: flex; justify-content: space-between;
      background: var(--bg-base); border: 1px solid var(--border); }
    .feed-name { color: var(--text-body); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feed-count { color: var(--accent); font-weight: 800; flex-shrink: 0; }

    .loading { color: var(--text-muted); font-style: italic; padding: 40px 0; text-align: center; }
    footer{background:var(--bg-card);border-top:1px solid var(--border);padding:48px 20px;text-align:center;margin-top:60px}
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo-text">
      <svg width="28" height="28" viewBox="0 0 32 32">
        <rect width="32" height="32" fill="#D10047"/>
        <text x="16" y="24" font-family="Georgia, serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">П</text>
      </svg>
      <span>ПРЕСЕК</span>
    </a>
    <a href="/" class="back-link">← Назад</a>
  </div>
</header>

<div class="wrap">
  <h1>Статистики</h1>
  <div class="kpi-grid" id="kpiGrid">
    <div class="loading">Се вчитуваат податоци…</div>
  </div>

  <div class="two-col">
    <div class="panel">
      <h2>По категорија</h2>
      <div id="catBars"><div class="loading">…</div></div>
    </div>
    <div class="panel">
      <h2>Топ извори</h2>
      <div id="srcBars"><div class="loading">…</div></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:32px">
    <h2>🔥 Најчитано</h2>
    <div id="clickList"><div class="loading">…</div></div>
  </div>

  <div class="panel">
    <h2>Активни извори</h2>
    <div class="feed-grid" id="feedGrid"><div class="loading">…</div></div>
  </div>
</div>

<footer>
  <strong style="font-family:var(--display); font-size:1.2rem; color:var(--headline); letter-spacing:.05em">ПРЕСЕК</strong>
  <p style="margin-top:8px; font-size:.9rem; opacity:0.6">Вашиот дневен преглед на македонски вести</p>
</footer>

<script>
async function load() {
  try {
    const [statsRes, healthRes] = await Promise.all([
      fetch('/api/stats/full'),
      fetch('/api/health'),
    ]);
    const s = await statsRes.json();
    const h = await healthRes.json();

    document.getElementById('kpiGrid').innerHTML = [
      [s.total_articles.toLocaleString(), 'Вкупно статии'],
      [s.last_24h.toLocaleString(), 'Денес'],
      [s.last_7d.toLocaleString(), 'Оваа недела'],
      [s.summarized_pct + '%', 'Сумирани'],
      [s.db_size_mb + ' MB', 'База'],
      [s.total_feeds, 'RSS Извори'],
    ].map(([v, l]) => `<div class="kpi"><div class="kpi-val">${v}</div><div class="kpi-label">${l}</div></div>`).join('');

    const maxCat = Math.max(...s.by_category.map(r => r.n));
    document.getElementById('catBars').innerHTML = s.by_category.map(r => `
      <div class="bar-row">
        <div class="bar-label">${r.cat}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.n/maxCat*100)}%"></div></div>
        <div class="bar-num">${r.n}</div>
      </div>`).join('');

    const maxSrc = Math.max(...s.by_source.map(r => r.n));
    document.getElementById('srcBars').innerHTML = s.by_source.slice(0,15).map(r => `
      <div class="bar-row">
        <div class="bar-label">${r.source}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.n/maxSrc*100)}%"></div></div>
        <div class="bar-num">${r.n}</div>
      </div>`).join('');

    if (s.top_clicked?.length) {
      document.getElementById('clickList').innerHTML = s.top_clicked.map((r, i) => `
        <div class="click-row">
          <div class="click-rank">${i+1}</div>
          <div class="click-title"><a href="${r.link}" target="_blank">${r.title}</a></div>
          <div class="click-src">${r.source}</div>
          <div class="click-n">${r.clicks}</div>
        </div>`).join('');
    } else {
      document.getElementById('clickList').innerHTML = '<div class="loading">Нема податоци.</div>';
    }

    document.getElementById('feedGrid').innerHTML = s.by_source.map(r =>
      `<div class="feed-item"><span class="feed-name">${r.source}</span><span class="feed-count">${r.n}</span></div>`
    ).join('');

  } catch(e) {}
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
