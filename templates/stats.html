<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пресек — Статистики</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f2ead8; --card: #faf5e9; --border: #c8b89a;
      --text: #1a1410; --muted: #7a6a52; --red: #8b1a1a;
      --green: #2a6a2a; --gold: #7a5c00;
      --font: 'Noto Serif', Georgia, serif;
      --sans: 'Noto Sans', sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141210; --card: #221e16; --border: #3a3020;
        --text: #ede0c4; --muted: #7a6a50; --red: #b03030;
        --green: #4aaf4a; --gold: #c9a030;
      }
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

    .top-bar {
      background: var(--card); border-bottom: 3px solid var(--red);
      padding: 0.6rem 1.5rem; display: flex; align-items: center; gap: 1.5rem;
    }
    .top-bar a { font-family: var(--font); font-size: 1.4rem; font-weight: 700;
      letter-spacing: 0.1em; color: var(--red); text-decoration: none; }
    .top-bar span { font-size: 0.72rem; color: var(--muted); }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

    h1 { font-size: 1.1rem; font-weight: 700; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1.25rem;
      padding-bottom: 0.4rem; border-bottom: 2px solid var(--border); }

    /* KPI cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1.75rem; }
    .kpi {
      background: var(--card); border: 1px solid var(--border);
      padding: 1rem 1rem 0.75rem; text-align: center;
    }
    .kpi-val { font-size: 2rem; font-weight: 700; color: var(--red); line-height: 1; }
    .kpi-label { font-size: 0.65rem; color: var(--muted); font-family: var(--sans);
      text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.3rem; }

    /* Two-col layout */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    @media (max-width: 650px) { .two-col { grid-template-columns: 1fr; } }

    .panel { background: var(--card); border: 1px solid var(--border); padding: 1rem; }
    .panel h2 { font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.75rem;
      padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }

    /* Bar chart rows */
    .bar-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.45rem; font-size: 0.75rem; }
    .bar-label { width: 110px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .bar-track { flex: 1; background: var(--border); height: 8px; border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--red); border-radius: 2px; transition: width 0.4s; }
    .bar-num { width: 36px; text-align: right; color: var(--muted); font-size: 0.68rem; flex-shrink: 0; }

    /* Top clicked table */
    .click-row { display: flex; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.74rem; align-items: baseline; }
    .click-rank { width: 20px; color: var(--red); font-weight: 700; flex-shrink: 0; }
    .click-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .click-title a { color: var(--text); text-decoration: none; }
    .click-title a:hover { color: var(--red); }
    .click-src { font-size: 0.62rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
    .click-n { font-weight: 700; color: var(--gold); width: 28px; text-align: right; flex-shrink: 0; }

    /* Feed status */
    .feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.4rem; }
    .feed-item { font-size: 0.7rem; padding: 0.3rem 0.5rem; display: flex; justify-content: space-between;
      background: var(--bg); border: 1px solid var(--border); }
    .feed-name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feed-count { color: var(--muted); font-weight: 700; flex-shrink: 0; margin-left: 0.4rem; }

    .loading { color: var(--muted); font-style: italic; font-size: 0.85rem; padding: 1rem 0; }
    .error   { color: var(--red); font-size: 0.8rem; padding: 0.5rem; }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="/" style="display:flex; align-items:center; gap:8px;">
    <svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="6" fill="var(--red)"/>
      <text x="16" y="24" font-family="Georgia, serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#f4ede0">П</text>
    </svg>
    <span>ПРЕСЕК</span>
  </a>
  <span>/ Статистики</span>
</div>

<div class="wrap">

  <!-- KPIs -->
  <h1>Преглед</h1>
  <div class="kpi-grid" id="kpiGrid">
    <div class="loading">Се вчитува…</div>
  </div>

  <!-- Category + Source bars -->
  <div class="two-col">
    <div class="panel">
      <h2>По категорија</h2>
      <div id="catBars"><div class="loading">…</div></div>
    </div>
    <div class="panel">
      <h2>Топ извори</h2>
      <div id="srcBars"><div class="loading">…</div></div>
    </div>
  </div>

  <!-- Most clicked -->
  <div class="panel" style="margin-bottom:1rem">
    <h2>🔥 Најчитано (кликови)</h2>
    <div id="clickList"><div class="loading">…</div></div>
  </div>

  <!-- Feed health -->
  <div class="panel">
    <h2>Активни извори ({{ year }})</h2>
    <div class="feed-grid" id="feedGrid"><div class="loading">…</div></div>
  </div>

</div>

<script>
async function load() {
  try {
    const [statsRes, healthRes] = await Promise.all([
      fetch('/api/stats/full'),
      fetch('/api/health'),
    ]);
    const s = await statsRes.json();
    const h = await healthRes.json();

    if (s.error) { document.getElementById('kpiGrid').innerHTML = `<div class="error">${s.error}</div>`; return; }

    // KPIs
    document.getElementById('kpiGrid').innerHTML = [
      [s.total_articles.toLocaleString(), 'Вкупно статии'],
      [s.last_24h.toLocaleString(), 'Денес'],
      [s.last_7d.toLocaleString(), 'Оваа недела'],
      [s.summarized_pct + '%', 'Сумирани'],
      [s.db_size_mb + ' MB', 'Големина на DB'],
      [s.total_feeds, 'RSS извори'],
      [s.uptime, 'Uptime'],
      [h.last_refresh?.errors?.length || 0, 'Грешки при освежување'],
    ].map(([v, l]) => `<div class="kpi"><div class="kpi-val">${v}</div><div class="kpi-label">${l}</div></div>`).join('');

    // Category bars
    const maxCat = Math.max(...s.by_category.map(r => r.n));
    document.getElementById('catBars').innerHTML = s.by_category.map(r => `
      <div class="bar-row">
        <div class="bar-label">${r.cat}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.n/maxCat*100)}%"></div></div>
        <div class="bar-num">${r.n}</div>
      </div>`).join('');

    // Source bars
    const maxSrc = Math.max(...s.by_source.map(r => r.n));
    document.getElementById('srcBars').innerHTML = s.by_source.slice(0,15).map(r => `
      <div class="bar-row">
        <div class="bar-label">${r.source}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.n/maxSrc*100)}%"></div></div>
        <div class="bar-num">${r.n}</div>
      </div>`).join('');

    // Top clicked
    if (s.top_clicked?.length) {
      document.getElementById('clickList').innerHTML = s.top_clicked.map((r, i) => `
        <div class="click-row">
          <div class="click-rank">${i+1}</div>
          <div class="click-title"><a href="${r.link}" target="_blank">${r.title}</a></div>
          <div class="click-src">${r.source}</div>
          <div class="click-n">${r.clicks}</div>
        </div>`).join('');
    } else {
      document.getElementById('clickList').innerHTML = '<div class="loading">Нема кликови уште — кликнете на некои наслови прво.</div>';
    }

    // Feed list from by_source (shows which feeds have articles)
    document.getElementById('feedGrid').innerHTML = s.by_source.map(r =>
      `<div class="feed-item"><span class="feed-name">${r.source}</span><span class="feed-count">${r.n}</span></div>`
    ).join('');

  } catch(e) {
    document.getElementById('kpiGrid').innerHTML = `<div class="error">Грешка при вчитување: ${e}</div>`;
  }
}
load();
setInterval(load, 60000);  // refresh every minute
</script>
</body>
</html>
