{% extends "base.html" %}

{% block title %}Архива | Пресек{% endblock %}

{% block content %}
<div class="page-content fade-in">
    <header class="page-header-left">
        <h1 class="nyt-title">Архива на вести</h1>
        <div class="archive-controls">
            <span class="archive-date-label">Избери датум:</span>
            <input type="date" id="archiveDate" class="archive-date-input" onchange="fetchArchive(true)">
            <span id="archiveStats" class="archive-stats-label"></span>
        </div>
    </header>

    <div id="archiveList" class="archive-list">
        <div class="skeleton-box" style="height:60px;width:100%;margin-bottom:1px"></div>
        <div class="skeleton-box" style="height:60px;width:100%;margin-bottom:1px"></div>
        <div class="skeleton-box" style="height:60px;width:100%;margin-bottom:1px"></div>
    </div>

    <div class="pagination-row">
        <button id="prevBtn" class="pag-btn" onclick="changePage(-1)" disabled>← Претходна</button>
        <span id="pageInfo" class="page-label">СТРАНА 1</span>
        <button id="nextBtn" class="pag-btn" onclick="changePage(1)" disabled>Следна →</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 0;
const pageSize  = 50;

document.getElementById('archiveDate').valueAsDate = new Date();

async function fetchArchive(resetPage) {
    if (resetPage) currentPage = 0;
    const date  = document.getElementById('archiveDate').value;
    const list  = document.getElementById('archiveList');
    const stats = document.getElementById('archiveStats');

    list.innerHTML = `
        <div class="skeleton-box" style="height:60px;width:100%;margin-bottom:1px"></div>
        <div class="skeleton-box" style="height:60px;width:100%;margin-bottom:1px"></div>
        <div class="skeleton-box" style="height:60px;width:100%;margin-bottom:1px"></div>`;

    try {
        const res  = await fetch(`/api/archive?date=${date}&page=${currentPage}&page_size=${pageSize}`);
        const data = await res.json();

        if (!data.articles || data.articles.length === 0) {
            list.innerHTML = '<div class="loading-state" style="padding:80px 0;">Нема пронајдени вести за овој датум.</div>';
            stats.textContent = '';
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = true;
            return;
        }

        stats.textContent = `${data.total.toLocaleString()} вести · ${data.sources} извори`;

        list.innerHTML = data.articles.map(a => {
            const time = new Date(a.created_at).toLocaleTimeString('mk-MK', {hour:'2-digit', minute:'2-digit'});
            return `
                <a href="${a.link}" target="_blank" rel="noopener" class="archive-row-nyt fade-in">
                    <div class="main-info">
                        <span class="ar-time">${time}</span>
                        <span class="ar-source">${a.source}</span>
                        <span class="ar-title">${a.title}</span>
                    </div>
                    <span class="archive-arrow">↗</span>
                </a>`;
        }).join('');

        document.getElementById('prevBtn').disabled = currentPage === 0;
        document.getElementById('nextBtn').disabled = !data.has_more;
        document.getElementById('pageInfo').textContent = `СТРАНА ${currentPage + 1}`;

    } catch (e) {
        console.error(e);
        list.innerHTML = '<div class="loading-state" style="padding:80px 0;color:var(--primary);">Грешка при вчитување.</div>';
    }
}

function changePage(delta) {
    currentPage += delta;
    fetchArchive();
    window.scrollTo({top: 0, behavior: 'smooth'});
}

fetchArchive();
</script>
{% endblock %}
