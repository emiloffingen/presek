<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Пресек — Архива</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      /* Dark Mode (Default) */
      --bg:#141210;--bg-card:#1f1b15;--bg-hover:#2a2418;
      --border:#3a3222;--border-dark:#4a3e2a;
      --color-text-primary: #E8EAED;
      --color-text-secondary: #9AA0A6;
      --headline: #E8EAED;
      --text: var(--headline);
      --text-body: var(--color-text-primary);
      --text-muted: var(--color-text-secondary);
      --red:#b03030;--red-light:#d05050;--gold:#c9a030;
      --serif:'Source Serif 4','Noto Serif',Georgia,serif;
      --display:'Playfair Display',Georgia,serif;
      --sans:'Noto Sans',sans-serif;
    }
    html.light,
    @media(prefers-color-scheme:light){:root{
      --bg:#f4ede0;--bg-card:#fefbf4;--bg-hover:#f5eed8;
      --border:#d4c5a4;--border-dark:#b8a882;
      --color-text-primary: #2D3134;
      --color-text-secondary: #5F6368;
      --headline: #2D3134;
      --text: var(--headline);
      --text-body: var(--color-text-primary);
      --text-muted: var(--color-text-secondary);
      --red:#8b1a1a;--red-light:#a52a2a;--gold:#8a6d1b;
    }}
    body{background:var(--bg);color:var(--text-body);font-family:var(--serif);font-size:17px;line-height:1.6;min-height:100vh;overflow-x:hidden}

    .top-bar{background:var(--bg-card);border-bottom:4px double var(--red);padding:.6rem 1.25rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:100}
    .brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.6rem;font-weight:900;letter-spacing:.08em;color:var(--text);text-decoration:none}
    .top-bar span{font-size:.85rem;color:var(--text-muted)}
    .back{font-size:.85rem;color:var(--text-muted);text-decoration:none;margin-left:auto}
    .back:hover{color:var(--red)}

    .wrap{max-width:900px;margin:0 auto;padding:1.5rem 1.25rem 4rem}

    h1{font-family:var(--display);font-size:1.4rem;font-weight:700;color:var(--text);margin-bottom:1rem;padding-bottom:.4rem;border-bottom:3px double var(--border-dark)}

    /* Date picker strip */
    .date-nav{display:flex;align-items:center;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap}
    .date-nav label{font-family:var(--sans);font-size:.85rem;font-weight:600;color:var(--text-muted)}
    .date-input{font-family:var(--serif);font-size:1rem;padding:.4rem .75rem;border:1px solid var(--border);border-radius:3px;background:var(--bg-card);color:var(--text);cursor:pointer}
    .date-input:focus{border-color:var(--red);outline:none}
    .date-btn{font-family:var(--sans);font-size:.85rem;font-weight:600;padding:.4rem .85rem;border:1px solid var(--border);border-radius:3px;background:var(--bg-card);color:var(--text-body);cursor:pointer;transition:all .12s}
    .date-btn:hover,.date-btn.active{background:var(--red);color:#fff;border-color:var(--red)}

    /* Stats line */
    .day-stats{font-family:var(--sans);font-size:.85rem;color:var(--text-muted);margin-bottom:1rem;display:flex;gap:1.5rem;flex-wrap:wrap}
    .day-stats strong{color:var(--text)}

    /* Article list */
    .article-row{background:var(--bg-card);border:1px solid var(--border);padding:.85rem 1rem;margin-bottom:.5rem;display:flex;gap:.85rem;align-items:flex-start;transition:background .12s}
    .article-row:hover{background:var(--bg-hover)}
    .art-thumb{width:90px;height:62px;object-fit:cover;flex-shrink:0;background:var(--border)}
    .art-thumb-ph{width:90px;height:62px;flex-shrink:0;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--text-muted)}
    .art-body{flex:1;min-width:0;overflow:hidden}
    .art-meta{font-family:var(--sans);font-size:.82rem;color:var(--text-muted);margin-bottom:.2rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
    .art-meta .src{font-weight:700;color:var(--text-body)}
    .art-meta .cat{font-size:.72rem;background:var(--border);border-radius:2px;padding:.08rem .35rem;color:var(--text-muted)}
    .art-meta .cat{background: var(--bg-hover)}
    .art-title a{font-size:1.1rem;font-weight:700;color:var(--text);text-decoration:none;line-height:1.35;display:block;overflow-wrap:break-word}
    .art-title a:hover{color:var(--red)}
    .art-desc{font-size:.9rem;color:var(--text-muted);margin-top:.2rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

    .loading{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-style:italic;font-size:1.05rem}
    .empty{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-style:italic}

    /* Pagination */
    .pager{display:flex;justify-content:center;gap:.5rem;padding:1.5rem 0}
    .pager-btn{font-family:var(--sans);font-size:.9rem;font-weight:600;padding:.45rem 1.2rem;border:2px solid var(--border);border-radius:3px;background:var(--bg-card);color:var(--text);cursor:pointer;transition:all .12s}
    .pager-btn:hover{border-color:var(--red);color:var(--red)}
    .pager-btn:disabled{opacity:.3;cursor:default}
    .pager-info{font-size:.85rem;color:var(--text-muted);align-self:center}

    footer{border-top:4px double var(--red);padding:1.25rem;text-align:center;color:var(--text-muted);font-size:.82rem;background:var(--bg-card);margin-top:2rem}
    .footer-brand{font-family:var(--display);font-size:1.15rem;font-weight:900;letter-spacing:.12em;color:var(--red);display:block;margin-bottom:.3rem}

    @media(max-width:600px){
      .wrap{padding:1rem .75rem 3rem}
      .art-thumb,.art-thumb-ph{width:75px;height:52px}
      .art-title a{font-size:1rem}
      h1{font-size:1.2rem}
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="/" class="brand">
    <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="loranditeCoreNav" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2B0000"/>
          <stop offset="50%" stop-color="#5A0A0A"/>
          <stop offset="100%" stop-color="#120000"/>
        </linearGradient>
        <radialGradient id="loranditeGlowNav" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FF3B3B" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="loranditeEdgeNav" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="42" fill="url(#loranditeGlowNav)" />
      <polygon points="50,8 78,30 70,78 30,92 18,42" fill="url(#loranditeCoreNav)" stroke="#8B1A1A" stroke-width="2"/>
      <line x1="50" y1="8" x2="30" y2="92" stroke="#FF4D4D" stroke-opacity="0.4"/>
      <line x1="50" y1="8" x2="70" y2="78" stroke="#FF4D4D" stroke-opacity="0.4"/>
      <line x1="18" y1="42" x2="78" y2="30" stroke="#FF4D4D" stroke-opacity="0.3"/>
      <polygon points="50,8 65,30 50,35" fill="url(#loranditeEdgeNav)" />
      <circle cx="50" cy="55" r="10" fill="#FF2A2A" opacity="0.15"/>
    </svg>
    <span>ПРЕСЕК</span>
  </a>
  <span>/ Архива</span>
  <a href="/" class="back">← Назад</a>
</div>

<div class="wrap">
  <h1>Архива на вести</h1>

  <div class="date-nav">
    <label>Датум:</label>
    <input type="date" class="date-input" id="datePicker">
    <button class="date-btn" onclick="goDay(-1)" id="prevBtn">← Претходен</button>
    <button class="date-btn active" onclick="goToday()">Денес</button>
    <button class="date-btn" onclick="goDay(1)" id="nextBtn">Следен →</button>
  </div>

  <div class="day-stats" id="dayStats"></div>

  <div id="articleList">
    <div class="loading">Се вчитуваат вести…</div>
  </div>

  <div class="pager" id="pager" style="display:none">
    <button class="pager-btn" id="prevPage" onclick="changePage(-1)">← Претходна</button>
    <span class="pager-info" id="pageInfo"></span>
    <button class="pager-btn" id="nextPage" onclick="changePage(1)">Следна →</button>
  </div>
</div>

<footer>
  <span class="footer-brand">ПРЕСЕК</span>
  Дневен преглед на македонски вести · {{ year }}
  · <a href="/" style="color:var(--text-muted);text-decoration:none">почетна</a>
  · <a href="/izvori" style="color:var(--text-muted);text-decoration:none">извори</a>
  · <a href="/stats" style="color:var(--text-muted);text-decoration:none">статистики</a>
</footer>

<script>
const MK_DAYS=['Недела','Понеделник','Вторник','Среда','Четврток','Петок','Сабота'];
const MK_MONTHS=['јануари','февруари','март','април','мај','јуни','јули','август','септември','октомври','ноември','декември'];
const PAGE_SIZE=50;
let currentDate=new Date();
let currentPage=0;
let totalArticles=0;

function fmtDate(d){return d.toISOString().slice(0,10)}
function mkDate(d){return`${MK_DAYS[d.getDay()]}, ${d.getDate()} ${MK_MONTHS[d.getMonth()]} ${d.getFullYear()}`}
function timeStr(ts){if(!ts)return'';try{const d=new Date(ts);return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}catch(e){return''}}

const picker=document.getElementById('datePicker');
picker.value=fmtDate(currentDate);
picker.max=fmtDate(new Date());
picker.addEventListener('change',()=>{currentDate=new Date(picker.value+'T12:00:00');currentPage=0;loadArchive()});

function goDay(offset){
  const d=new Date(currentDate);
  d.setDate(d.getDate()+offset);
  if(d>new Date())return;
  currentDate=d;
  picker.value=fmtDate(currentDate);
  currentPage=0;
  loadArchive();
}
function goToday(){currentDate=new Date();picker.value=fmtDate(currentDate);currentPage=0;loadArchive()}
function changePage(dir){currentPage+=dir;loadArchive()}

async function loadArchive(){
  const list=document.getElementById('articleList');
  list.innerHTML='<div class="loading">Се вчитуваат вести…</div>';

  const dateStr=fmtDate(currentDate);
  try{
    const res=await fetch(`/api/archive?date=${dateStr}&page=${currentPage}&page_size=${PAGE_SIZE}`);
    const data=await res.json();
    totalArticles=data.total||0;

    // Stats
    document.getElementById('dayStats').innerHTML=`
      <span><strong>${mkDate(currentDate)}</strong></span>
      <span>${totalArticles} вести</span>
      <span>${data.sources||0} извори</span>
      <span>${data.categories||0} категории</span>`;

    // Disable next if in the future
    const tomorrow=new Date(currentDate);tomorrow.setDate(tomorrow.getDate()+1);
    document.getElementById('nextBtn').disabled=tomorrow>new Date();

    if(!data.articles||!data.articles.length){
      list.innerHTML='<div class="empty">Нема вести за овој ден.</div>';
      document.getElementById('pager').style.display='none';
      return;
    }

    list.innerHTML=data.articles.map(a=>{
      const thumb=a.image_url
        ?`<img class="art-thumb" src="/proxy?url=${encodeURIComponent(a.image_url)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'art-thumb-ph\\'>📰</div>'">`
        :`<div class="art-thumb-ph">📰</div>`;
      const desc=a.description?`<div class="art-desc">${a.description}</div>`:'';
      return`<div class="article-row">
        ${thumb}
        <div class="art-body">
          <div class="art-meta">
            <span class="src">${a.source||''}</span>
            <span class="cat">${a.category||'Македонија'}</span>
            <span>· ${timeStr(a.created_at)}</span>
          </div>
          <div class="art-title"><a href="${a.link}" target="_blank" rel="noopener">${a.title}</a></div>
          ${desc}
        </div>
      </div>`
    }).join('');

    // Pagination
    const totalPages=Math.ceil(totalArticles/PAGE_SIZE);
    if(totalPages>1){
      document.getElementById('pager').style.display='flex';
      document.getElementById('prevPage').disabled=currentPage<=0;
      document.getElementById('nextPage').disabled=currentPage>=totalPages-1;
      document.getElementById('pageInfo').textContent=`${currentPage+1} / ${totalPages}`;
    }else{
      document.getElementById('pager').style.display='none';
    }
  }catch(e){
    list.innerHTML='<div class="empty">Грешка при вчитување.</div>';
  }
}

loadArchive();
</script>
</body>
</html>
