{% extends "base.html" %}

{% block title %}Дневен Брифинг | Пресек{% endblock %}

{% block content %}
<div class="briefing-container fade-in">
    <div class="briefing-card">
        <span class="briefing-meta" id="briefingDate">Вчитувам…</span>
        <h1 class="hero-title" style="margin-bottom:var(--space-xl)">
            Дневен <span style="color:var(--primary)">Брифинг</span>
        </h1>

        <div id="briefingContent" class="briefing-content">
            <div>
                <div class="skeleton-box" style="height:18px;width:82%;margin-bottom:12px"></div>
                <div class="skeleton-box" style="height:18px;width:91%;margin-bottom:12px"></div>
                <div class="skeleton-box" style="height:18px;width:74%;margin-bottom:12px"></div>
                <div class="skeleton-box" style="height:18px;width:88%;margin-bottom:12px"></div>
                <div class="skeleton-box" style="height:18px;width:65%;margin-bottom:30px"></div>
                <div class="skeleton-box" style="height:18px;width:79%;margin-bottom:12px"></div>
                <div class="skeleton-box" style="height:18px;width:93%;margin-bottom:12px"></div>
                <div class="skeleton-box" style="height:18px;width:70%"></div>
            </div>
        </div>

        <div class="briefing-footer">
            Составено врз основа на најважните вести во последните 24 часа.
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadBriefing() {
    try {
        const res = await fetch('/api/briefing');
        const data = await res.json();

        if (data.error) {
            document.getElementById('briefingContent').innerHTML =
                `<p style="text-align:center;color:var(--text-muted)">${data.error}</p>`;
            document.getElementById('briefingDate').textContent = 'Нема податоци';
            return;
        }

        const d = new Date(data.date);
        document.getElementById('briefingDate').textContent = d.toLocaleDateString('mk-MK', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        const content = document.getElementById('briefingContent');
        content.innerHTML = '';
        
        const rawContent = data.content || '';
        const paragraphs = rawContent.split('\n\n').filter(p => p.trim());
        
        paragraphs.forEach(para => {
            const p = document.createElement('p');
            // Simple mini-markdown: **bold** and * bullet points
            let html = para
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/^[\*•-]\s+(.*)/gm, '• $1')
                .replace(/\n/g, '<br>');
            
            p.innerHTML = html;
            content.appendChild(p);
        });

    } catch (e) {
        console.error(e);
        document.getElementById('briefingContent').innerHTML =
            '<p style="text-align:center;color:var(--primary)">Грешка при вчитување на брифингот.</p>';
    }
}
loadBriefing();
</script>
{% endblock %}
