{% extends "base.html" %}

{% block title %}Извори | Пресек{% endblock %}

{% block content %}
<div class="page-content fade-in">
    <header class="page-header">
        <h1 class="nyt-title">Медиумски Именик</h1>
        <p class="page-subtitle">Целосна листа на индексирани извори во мрежата на Пресек</p>
        <div style="max-width: 400px; margin: var(--space-md) auto 0;">
            <input type="text" id="sourceFilter" class="archive-date-input" style="width: 100%; border-radius: 20px; padding: 10px 16px;" placeholder="Пребарај извори...">
        </div>
    </header>

    <div class="sources-directory">
        <div>
            <h2 class="rail-label sources-section-title">Македонски Медиуми</h2>
            <div id="mkIzvori" class="sources-columns"></div>
        </div>
        <div>
            <h2 class="rail-label sources-section-title">Меѓународни Медиуми</h2>
            <div id="intIzvori" class="sources-columns"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const mk = [
    "Sloboden Pecat","Kanal 5","MIA","Sitel","Telma","Kurir",
    "Republika","Fokus","Nezavisen","Faktor","Vecer","Meta",
    "360 Stepeni","Makfax","Nova Makedonija","Infomax","Press24",
    "Skopje1","Plusinfo","Lokalno","4News","Makpress","Vistinomer",
    "Lider","MKD","NetPress","Akademik","Skopje Info",
    "Prizma","Expres","Tetovo Info","A1on","SportSport",
    "Strumica Info","24 Вести","TV21","Слободна Европа",
    "Deutsche Welle","Civil Media","Радио МОФ",
    "Сакам да кажам","Бизнис Вести","Ohrid News","Vecer Sport",
    "Ekonomija","Zdravje","MRT","Time.mk","Kolumna","Okno",
    "Alfa TV","Tocka","IRL","Nova TV","Libertas","Racin",
    "Kajgana","Pari.com.mk","Bloomberg Adria","E-Magazin",
    "IT.mk","Sportmanija","Fakulteti","Magazin"
];

const diaspora = [
    "Tagesschau","Der Spiegel","ZDF Heute","Süddeutsche Zeitung","Die Zeit",
    "SRF News","20 Minuten","CNN","NPR","Reuters","CBC News",
    "Fox News","BBC News","The Guardian","France24","EuroNews",
    "Politico Europe","ABC Australia","Al Jazeera","SCMP","NHK World",
    "Times of India","RFI English","ANSA","RTVSLO","ORF","SVT News",
    "N1 Info","B92","Kurir.rs","Blic.rs","Novinite","Dnevnik.bg",
    "Kathimerini","RTS","FAZ","Swissinfo","AP News","The Verge",
    "Ars Technica","TechCrunch","Axios","ESPN","Exit News",
    "Balkan Insight","Daily Sabah","TRT World",
    "Index.hr","Jutarnji","Klix.ba","Vijesti.me"
];

let hotSources = new Set();

function renderLists(filter = '') {
    const term = filter.toLowerCase();
    
    const mkFiltered = mk.filter(s => s.toLowerCase().includes(term)).sort();
    const intFiltered = diaspora.filter(s => s.toLowerCase().includes(term)).sort();

    document.getElementById('mkIzvori').innerHTML = mkFiltered.length ? mkFiltered.map(name => `
        <a href="/izvor/${encodeURIComponent(name)}" class="source-link">
            <span>${name} ${hotSources.has(name) ? '<span class="src-badge pulse" style="margin-left:4px;">HOT</span>' : ''}</span>
        </a>`).join('') : '<span style="color:var(--text-muted);font-size:0.8rem;">Нема резултати</span>';

    document.getElementById('intIzvori').innerHTML = intFiltered.length ? intFiltered.map(name => `
        <a href="/izvor/${encodeURIComponent(name)}" class="source-link">
            <span>${name}</span>
        </a>`).join('') : '<span style="color:var(--text-muted);font-size:0.8rem;">Нема резултати</span>';
}

document.getElementById('sourceFilter').addEventListener('input', (e) => {
    renderLists(e.target.value);
});

async function loadPulse() {
    try {
        const res = await fetch('/api/sources/pulse');
        const data = await res.json();
        // Mark top 5 sources as HOT
        (data || []).slice(0, 5).forEach(r => hotSources.add(r.source));
    } catch (e) {}
    renderLists();
}

renderLists();
loadPulse();
</script>
{% endblock %}
