{% extends "base.html" %}

{% block title %}Извори | Пресек{% endblock %}

{% block content %}
<div class="fade-in" style="max-width: var(--max-width); margin: 0 auto; padding: var(--space-xl) var(--space-md);">
    <header style="margin-bottom: var(--space-2xl); border-bottom: 3px double var(--text-primary); padding-bottom: var(--space-lg); text-align: center;">
        <h1 class="nyt-title" style="margin-bottom: 10px;">Медиумски Именик</h1>
        <p style="font-family: var(--font-body); font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700;">
            Целосна листа на индексирани извори во мрежата на Пресек
        </p>
    </header>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2xl);">
        <div>
            <h2 class="rail-label" style="border-bottom: 1px solid var(--text-primary); padding-bottom: 8px; margin-bottom: 20px; font-size: 0.9rem;">🇲🇰 Македонски Медиуми</h2>
            <div id="mkIzvori" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px 40px;"></div>
        </div>
        <div>
            <h2 class="rail-label" style="border-bottom: 1px solid var(--text-primary); padding-bottom: 8px; margin-bottom: 20px; font-size: 0.9rem;">🌍 Меѓународни Медиуми</h2>
            <div id="intIzvori" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px 40px;"></div>
        </div>
    </div>
</div>

<style>
    .source-link {
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--text-primary);
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: color 0.2s ease;
    }
    .source-link:hover { color: var(--primary); border-bottom-color: var(--primary); }
    .source-link::after { content: '→'; font-size: 0.7rem; opacity: 0.3; }
</style>
{% endblock %}

{% block scripts %}
<script>
const mk = [
    "Sloboden Pecat","Kanal 5","MIA","Sitel","Telma","Kurir",
    "Republika","Fokus","Nezavisen","Faktor","Vecer","Meta",
    "360 Stepeni","Makfax","Nova Makedonija","Infomax","Press24",
    "Skopje1","Plusinfo","Lokalno","4News","Makpress","Vistinomer",
    "Lider","MKD","NetPress","Akademik","Skopje Info",
    "Prizma","Expres","Tetovo Info","A1on","SportSport",
    "Strumica Info","24 Вести","TV21","Слободна Европа",
    "Deutsche Welle","Civil Media","Радио МОФ",
    "Сакам да кажам","Бизнис Вести","Ohrid News","Vecer Sport",
    "Ekonomija","Zdravje","MRT","Time.mk","Kolumna","Okno",
    "Alfa TV","Tocka","IRL","Nova TV","Libertas","Racin",
    "Kajgana","Pari.com.mk","Bloomberg Adria","E-Magazin",
    "IT.mk","Sportmanija","Fakulteti","Magazin"
];

const diaspora = [
    "Tagesschau","Der Spiegel","ZDF Heute","Süddeutsche Zeitung","Die Zeit",
    "SRF News","20 Minuten","CNN","NPR","Reuters","CBC News",
    "Fox News","BBC News","The Guardian","France24","EuroNews",
    "Politico Europe","ABC Australia","Al Jazeera","SCMP","NHK World",
    "Times of India","RFI English","ANSA","RTVSLO","ORF","SVT News",
    "N1 Info","B92","Kurir.rs","Blic.rs","Novinite","Dnevnik.bg",
    "Kathimerini","RTS","FAZ","Swissinfo","AP News","The Verge",
    "Ars Technica","TechCrunch","Axios","ESPN","Exit News",
    "Balkan Insight","Daily Sabah","TRT World",
    "Index.hr","Jutarnji","Klix.ba","Vijesti.me"
];

function makeList(list) {
    return list.sort().map(name => `
        <a href="/izvor/${encodeURIComponent(name)}" class="source-link">
            <span>${name}</span>
        </a>`
    ).join('');
}

document.getElementById('mkIzvori').innerHTML  = makeList(mk);
document.getElementById('intIzvori').innerHTML = makeList(diaspora);
</script>
{% endblock %}
