{% extends "base.html" %}

{% block title %}Извори | Пресек{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="hero-section" style="margin-bottom: var(--space-xl);">
        <h1 class="hero-title">Медиумски <span style="color:var(--primary)">Извори</span></h1>
        <p class="hero-subtitle">Пресек агрегира вести од 60+ македонски и меѓународни извори во реално време.</p>
    </div>

    <h2 class="section-title">🇲🇰 Македонски Медиуми</h2>
    <div class="bento-grid" id="mkIzvori" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); grid-auto-rows: auto; margin-bottom: var(--space-2xl);"></div>

    <h2 class="section-title">🌍 Меѓународни Медиуми</h2>
    <div class="bento-grid" id="intIzvori" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); grid-auto-rows: auto;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const mk = [
    "Sloboden Pecat","Kanal 5","MIA","Sitel","Telma","Kurir",
    "Republika","Fokus","Nezavisen","Faktor","Vecer","Meta",
    "360 Stepeni","Makfax","Nova Makedonija","Infomax","Press24",
    "Skopje1","Plusinfo","Lokalno","4News","Makpress","Vistinomer",
    "Lider","MKD","NetPress","Akademik","Skopje Info",
    "Prizma","Expres","Tetovo Info","A1on","SportSport",
    "Strumica Info","24 Вести","TV21","Слободна Европа",
    "Deutsche Welle","Civil Media","Радио МОФ",
    "Сакам да кажам","Бизнис Вести","Ohrid News","Vecer Sport",
    "Ekonomija","Zdravje","MRT","Time.mk","Kolumna","Okno",
    "Alfa TV","Tocka","IRL","Nova TV","Libertas","Racin",
    "Kajgana","Pari.com.mk","Bloomberg Adria","E-Magazin",
    "IT.mk","Sportmanija","Fakulteti","Magazin"
];

const diaspora = [
    "Tagesschau","Der Spiegel","ZDF Heute","Süddeutsche Zeitung","Die Zeit",
    "SRF News","20 Minuten","CNN","NPR","Reuters","CBC News",
    "Fox News","BBC News","The Guardian","France24","EuroNews",
    "Politico Europe","ABC Australia","Al Jazeera","SCMP","NHK World",
    "Times of India","RFI English","ANSA","RTVSLO","ORF","SVT News",
    "N1 Info","B92","Kurir.rs","Blic.rs","Novinite","Dnevnik.bg",
    "Kathimerini","RTS","FAZ","Swissinfo","AP News","The Verge",
    "Ars Technica","TechCrunch","Axios","ESPN","Exit News",
    "Balkan Insight","Daily Sabah","TRT World",
    "Index.hr","Jutarnji","Klix.ba","Vijesti.me"
];

function makeCards(list, muted) {
    return list.sort().map(name => `
        <a href="/izvor/${encodeURIComponent(name)}" class="bento-card" style="padding: var(--space-md); flex-direction: row; align-items: center; gap: 12px;">
            <div class="izvor-dot${muted ? ' muted' : ''}" style="width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0;"></div>
            <span class="izvor-name" style="font-weight: 600; font-size: 0.9rem;">${name}</span>
        </a>`
    ).join('');
}

document.getElementById('mkIzvori').innerHTML  = makeCards(mk, false);
document.getElementById('intIzvori').innerHTML = makeCards(diaspora, true);
</script>
{% endblock %}
