<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" id="themeMeta" content="#0F1113">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <title>{% block title %}Пресек{% endblock %}</title>
    <link rel="stylesheet" href="/static/modern.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="header-logo">
                <img src="/static/logo.svg" alt="Пресек">
            </a>
            <div class="header-actions">
                <button class="icon-btn" id="searchOpen" onclick="document.getElementById('searchOverlay').classList.add('active'); document.getElementById('searchInput').focus();">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <button class="icon-btn" onclick="const isLight = document.documentElement.classList.toggle('light'); localStorage.setItem('theme', isLight ? 'light' : 'dark');">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <div id="readingProgress"></div>

    <main class="site-layout">
        {% block content %}{% endblock %}
    </main>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-bar-wrap">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Пребарај вести..." autocomplete="off" 
                       oninput="Presek.state.query = this.value; Presek.fetchNews();">
                <button class="icon-btn" onclick="document.getElementById('searchOverlay').classList.remove('active'); Presek.state.query = ''; Presek.fetchNews();">
                    &times;
                </button>
            </div>
        </div>
    </div>

    <!-- Presek 4.0 Core -->
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/app.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
