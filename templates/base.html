<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" id="themeMeta" content="#0B0C10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/logo.png">

    <title>{% block title %}Пресек | Вашиот Дневен Преглед{% endblock %}</title>

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/modern.css">
    
    <!-- Theme Script -->
    <script>(function(){var s=localStorage.getItem('theme');if(s==='light'||(s===null&&window.matchMedia('(prefers-color-scheme: light)').matches)){document.documentElement.classList.add('light');}})();</script>
    
    {% block head %}{% endblock %}
</head>
<body class="theme-ready">
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo-text">
                <img src="/static/logo.svg" alt="Presek Logo" width="32" height="32">
                <span>ПРЕСЕК</span>
            </a>
            
            <div class="header-ticker">
                <div class="ticker-inner" id="tickerInner">
                    <!-- Populated by JS -->
                    <span class="utility-ticker">Вчитување на трендови...</span>
                </div>
            </div>

            <div class="header-right">
                <button id="themeToggle" class="action-btn" title="Промени тема" aria-label="Toggle dark mode">
                    <svg id="sunIcon" viewBox="0 0 24 24" width="24" height="24">
                        <circle id="sunCore" cx="12" cy="12" r="5" fill="currentColor"/>
                        <g id="sunRays" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </g>
                    </svg>
                </button>
                <a href="/arhiva" class="action-btn" title="Архива">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8v13H3V8M1 3h22v5H1V3zm7 8h8"/></svg>
                </a>
            </div>
        </div>
    </header>

    <main class="site-layout">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-logo">ПРЕСЕК</div>
            <p>&copy; {{ year }} Пресек. Сите права се задржани.</p>
            <div class="footer-links">
                <a href="/about">За Нас</a>
                <a href="/izvori">Извори</a>
                <a href="/stats">Статистика</a>
                <a href="/privacy">Приватност</a>
                <a href="/contact">Контакт</a>
            </div>
        </div>
    </footer>

    <!-- Global Scripts -->
    <script>
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('light');
            const isLight = document.documentElement.classList.contains('light');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('themeMeta').setAttribute('content', isLight ? '#F0F2F3' : '#0B0C10');
        });

        // Initialize ticker
        fetch('/api/top10')
            .then(res => res.json())
            .then(data => {
                const inner = document.getElementById('tickerInner');
                if (!data || !data.length) {
                    inner.innerHTML = '<span class="utility-ticker">Нема активни вести</span>';
                    return;
                }
                inner.innerHTML = '';
                // Duplicate for smooth infinite scroll
                const items = [...data, ...data];
                items.forEach((item, idx) => {
                    const a = document.createElement('a');
                    a.className = 'popular-item';
                    a.href = `/cluster/${item.cluster_id}`;
                    
                    const art = item.articles[0];
                    const headline = art.headline || art.title;
                    const isBreaking = item.is_breaking;
                    
                    a.innerHTML = `
                        ${isBreaking ? `
                            <span style="display:inline-flex; align-items:center; color:var(--primary); font-weight:800; font-size:0.6rem; border:1px solid var(--primary); padding:0px 6px; border-radius:2px; margin-right:8px; gap:4px;">
                                <span style="width:6px; height:6px; background:var(--primary); border-radius:50%; animation: pulse-live 1.5s infinite;"></span>
                                ВО ЖИВО
                            </span>
                        ` : ''}
                        <span class="rank">#${(idx % data.length) + 1}</span> ${headline}
                    `;
                    inner.appendChild(a);
                    if (idx < items.length - 1) {
                        const sep = document.createElement('div');
                        sep.className = 'popular-sep';
                        sep.style.width = '1px';
                        sep.style.height = '12px';
                        sep.style.background = 'var(--border)';
                        inner.appendChild(sep);
                    }
                });
            });
            
        // Reveal animation on load
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.body.classList.add('theme-ready');
            }, 100);

            // Handle broken images
            document.body.addEventListener('error', (e) => {
                if (e.target.tagName === 'IMG' && !e.target.classList.contains('no-fallback')) {
                    const isLight = document.documentElement.classList.contains('light');
                    const fallback = isLight ? '/static/img/placeholder_light.svg' : '/static/img/placeholder.svg';
                    if (e.target.src !== location.origin + fallback) {
                        e.target.src = fallback;
                        e.target.style.objectFit = 'cover';
                    }
                }
            }, true);
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
