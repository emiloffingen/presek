<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" id="themeMeta" content="#0D0F11">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="apple-touch-icon" href="/static/logo.png">

    <!-- Google Fonts: Lora (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>{% block title %}Пресек{% endblock %}</title>
    <link rel="stylesheet" href="/static/modern.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="header-logo">
                <img src="/static/logo.svg" alt="Пресек">
            </a>
            <div class="header-actions">
                <button class="icon-btn" id="searchOpen"
                    onclick="document.getElementById('searchOverlay').classList.add('active'); document.getElementById('searchInput').focus();"
                    aria-label="Пребарај">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
                <button class="icon-btn" id="themeToggle" aria-label="Промени тема">
                    <svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div id="readingProgress"></div>

    <main class="site-layout">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="footer-logo">Пресек</span>
                <p class="footer-tagline">Македонски агрегатор на вести со групирање и синтеза преку вештачка интелигенција.</p>
            </div>
            <nav class="footer-links">
                <a href="/izvori">Извори</a>
                <a href="/stats">Статистики</a>
                <a href="/briefing">Брифинг</a>
                <a href="/about">За нас</a>
                <a href="/contact">Контакт</a>
                <a href="/privacy">Приватност</a>
            </nav>
        </div>
        <div class="footer-bottom">
            <span class="footer-copy">&copy; 2025 Пресек. Сите права се задржани.</span>
        </div>
    </footer>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-bar-wrap">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Пребарај вести..." autocomplete="off"
                       oninput="Presek.state.query = this.value; Presek.fetchNews();">
                <button class="icon-btn" onclick="document.getElementById('searchOverlay').classList.remove('active'); Presek.state.query = ''; Presek.fetchNews();" aria-label="Затвори">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Presek 4.0 Core -->
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/app.js"></script>

    <script>
        // Theme toggle
        (function () {
            var btn = document.getElementById('themeToggle');
            var meta = document.getElementById('themeMeta');
            if (!btn) return;
            btn.addEventListener('click', function () {
                var isLight = document.documentElement.classList.toggle('light');
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
                if (meta) meta.content = isLight ? '#F3F5F7' : '#0D0F11';
            });
        })();

        // Reading progress bar
        (function () {
            var bar = document.getElementById('readingProgress');
            if (!bar) return;
            window.addEventListener('scroll', function () {
                var doc = document.documentElement;
                var top = doc.scrollTop || document.body.scrollTop;
                var height = doc.scrollHeight - doc.clientHeight;
                bar.style.width = height > 0 ? (top / height * 100) + '%' : '0%';
            }, { passive: true });
        })();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
