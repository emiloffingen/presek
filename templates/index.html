<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Пресек | Вашиот Дневен Преглед</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#D10047">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans:wght@400;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================
       DESIGN TOKENS (MINERAL LUXURY)
       ========================================= */
    :root {
      /* Dark Mode (Default) */
      --color-bg-base: #141618;
      --color-bg-surface: #1A1C1E;
      --color-bg-surface-hover: #232629;
      --color-text-primary: #E0E2E4;
      --color-text-secondary: #8C8E90;
      --color-ruby: #D10047;
      --color-bronze: #8C6D3E;
      --color-gold: #D4AF37;
      --border-opacity: 0.2;
      --pattern-opacity: 0.03;
      --logo-gradient: linear-gradient(to right, #fff, var(--color-gold));

      --bg: var(--color-bg-base);
      --bg-card: var(--color-bg-surface);
      --border: rgba(140, 109, 62, var(--border-opacity));
      --accent: var(--color-ruby);
      --gold: var(--color-gold);
      --bronze: var(--color-bronze);
      --headline: #FFFFFF;
      --text-body: var(--color-text-primary);
      --text-muted: var(--color-text-secondary);
      
      --border-radius-sm: 0px;
      --border-radius-md: 0px;
      --border-radius-lg: 0px;

      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-body: 1rem;
      --font-size-md: 1.125rem;
      --font-size-lg: 1.5rem;
      --line-height-body: 1.6;
      --line-height-heading: 1.1;
      --spacing-md: 16px;
      --layout-max-width: 1280px;
      --layout-sidebar-width: 320px;
      --grid-gap: 32px;
      --serif: 'Source Serif 4', Georgia, serif;
      --display: 'Playfair Display', Georgia, serif;
      --sans: 'Noto Sans', sans-serif;
    }

    @media(prefers-color-scheme: light) {
      :root {
        --color-bg-base: #F0F2F3;
        --color-bg-surface: #FFFFFF;
        --color-bg-surface-hover: #E8EAEB;
        --color-text-primary: #1A1C1E;
        --color-text-secondary: #5C5E60;
        --border-opacity: 0.4;
        --pattern-opacity: 0.05;
        --logo-gradient: linear-gradient(to right, var(--color-ruby), var(--color-bronze));
        
        --bg: var(--color-bg-base);
        --bg-card: var(--color-bg-surface);
        --headline: #141618;
        --text-body: var(--color-text-primary);
        --text-muted: var(--color-text-secondary);
      }
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{
      --crystal-pattern: 
        linear-gradient(30deg, transparent 49%, rgba(140, 109, 62, var(--pattern-opacity)) 50%, transparent 51%),
        linear-gradient(-30deg, transparent 49%, rgba(140, 109, 62, var(--pattern-opacity)) 50%, transparent 51%);
      background: var(--bg);
      background-image: var(--crystal-pattern);
      background-size: 100px 173px;
      color: var(--text-body);
      font-family: var(--serif);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* TICKER */
    .ticker-bar{background:var(--bg-card);border-bottom:1px solid var(--border);height:32px;display:flex;align-items:center;overflow:hidden}
    .ticker-label{background:var(--accent);color:#fff;font-size:.6rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:0 1rem;height:100%;display:flex;align-items:center;white-space:nowrap;flex-shrink:0;font-family:var(--sans)}
    .ticker-track{flex:1;overflow:hidden}
    .ticker-inner{display:flex;gap:3rem;white-space:nowrap;animation:ticker 80s linear infinite;font-size:var(--font-size-xs);color:var(--text-muted)}
    @keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

    /* HEADER */
    .site-header{background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .header-inner{display:flex;align-items:center;justify-content:space-between;padding:0 var(--spacing-md);max-width:var(--layout-max-width);margin:0 auto;height:64px;gap:var(--spacing-md)}
    .logo-text{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:1.8rem;font-weight:900;color:var(--headline);text-decoration:none;letter-spacing:-0.02em}
    .logo-text span{background:var(--logo-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    
    .header-right{display:flex;align-items:center;gap:var(--spacing-md)}
    .lorandite-btn{background:none;color:var(--gold);border:1px solid var(--bronze);font-family:var(--sans);font-size:.65rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:.6rem 1rem;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;gap:8px}
    .lorandite-btn:hover{background:var(--bronze);color:#fff;border-color:var(--gold)}
    .lorandite-btn svg{width:14px;height:14px;fill:currentColor}
    
    .refresh-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;transition:all .3s}
    .refresh-btn:hover{color:var(--gold);transform:rotate(180deg)}
    .refresh-btn svg{width:22px;height:22px;fill:currentColor}

    /* CAT NAV */
    .cat-nav{background:var(--bg-card);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:64px;z-index:190;scrollbar-width:none}
    .cat-nav-inner{display:flex;padding:0 var(--spacing-md);max-width:var(--layout-max-width);margin:0 auto}
    .cat-btn{font-family:var(--sans);font-size:var(--font-size-sm);font-weight:700;color:var(--text-muted);background:none;border:none;border-bottom:2px solid transparent;padding:.8rem 1.2rem;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.1em;transition:all .15s}
    .cat-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

    /* TRENDS */
    .trending-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:8px 0}
    .trending-inner{display:flex;align-items:center;gap:12px;padding:0 var(--spacing-md);max-width:var(--layout-max-width);margin:0 auto;overflow-x:auto;scrollbar-width:none}
    .trend-chip{font-size:.7rem;font-weight:700;color:var(--text-muted);background:var(--bg-card);border:1px solid var(--border);padding:4px 12px;white-space:nowrap;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.05em}
    .trend-chip:hover{border-color:var(--gold);color:var(--gold)}

    /* MAIN LAYOUT */
    .site-layout{display:grid;grid-template-columns:1fr;max-width:var(--layout-max-width);margin:0 auto;gap:var(--grid-gap);padding:var(--spacing-md) var(--spacing-md) var(--spacing-xl)}
    @media(min-width:1024px){.site-layout{grid-template-columns:1fr var(--layout-sidebar-width);padding:32px var(--spacing-md)}}

    /* CARDS */
    .stories-grid{display:grid;grid-template-columns:1fr;gap:var(--grid-gap)}
    @media(min-width:768px){.stories-grid{grid-template-columns:1fr 1fr}}
    .story-card{background:var(--bg-card);padding:24px;border:1px solid var(--border);display:flex;flex-direction:column;gap:12px;transition:all .3s ease;position:relative;overflow:hidden}
    .story-card:hover{border-color:var(--gold);box-shadow:0 10px 30px rgba(0,0,0,0.3);transform:translateY(-2px)}
    .story-card::after{content:'';position:absolute;top:0;left:0;width:2px;height:0;background:var(--accent);transition:height .3s}
    .story-card:hover::after{height:100%}
    
    .story-meta{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:.65rem;font-weight:700;color:var(--bronze);text-transform:uppercase;letter-spacing:.15em}
    .story-headline{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1.3;margin:0}
    .story-headline a{color:var(--headline);text-decoration:none;transition:color .2s}
    .story-headline a:hover{color:var(--gold)}
    .story-thumb-wrap{width:100px;height:75px;overflow:hidden;flex-shrink:0;background:var(--bg);border:1px solid var(--border)}
    .story-thumb{width:100%;height:100%;object-fit:cover}
    
    .badge-count{color:var(--bronze);font-family:var(--sans);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em}

    /* SIDEBAR */
    .sidebar-inner{background:var(--bg-card); padding:24px; border:1px solid var(--border); display:flex; flex-direction:column; max-height:calc(100vh - 100px); position:sticky; top:84px}
    .sidebar-title{margin-bottom:20px; font-family:var(--display); font-size:1.1rem; color:var(--gold); letter-spacing:.05em; display:flex; align-items:center; gap:10px}
    .sidebar-title svg{width:18px; height:18px; fill:var(--color-ruby)}
    #sidebarPopular{overflow-y:hidden; flex:1}
    .sidebar-inner:hover #sidebarPopular{overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--gold) transparent}

    footer{background:var(--bg-card);border-top:1px solid var(--border);padding:48px var(--spacing-md);text-align:center;color:var(--text-muted)}
    .footer-links{display:flex;justify-content:center;gap:20px;margin-top:20px}
    .footer-links a{color:var(--text-muted);text-decoration:none;transition:color .2s;font-size:var(--font-size-sm);font-weight:700}
    .footer-links a:hover{color:var(--gold)}
    
    @media(max-width:767px){
      .logo-text{font-size:1.5rem}
      .story-card{padding:16px}
      .story-headline{font-size:1.15rem}
      .cat-nav{top:64px}
    }
  </style>
</head>
<body>

<div class="ticker-bar"><div class="ticker-label">ВО ЖИВО</div><div class="ticker-track"><div class="ticker-inner" id="tickerInner"></div></div></div>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo-text">
      <svg width="28" height="28" viewBox="0 0 32 32">
        <rect width="32" height="32" fill="#D10047"/>
        <text x="16" y="24" font-family="Georgia, serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">П</text>
      </svg>
      <span>ПРЕСЕК</span>
    </a>
    <div class="header-right">
      <button class="lorandite-btn" onclick="showTop10(this)">
        <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/></svg>
        Лорандит
      </button>
      <button class="refresh-btn" id="refreshBtn" onclick="fetchNews()">
        <svg viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="6" fill="currentColor"/>
          <path d="M16 2 L16 10 M16 22 L16 30 M2 16 L10 16 M22 16 L30 16 M6 6 L12 12 M20 20 L26 26 M26 6 L20 12 M12 20 L6 26" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<nav class="cat-nav"><div class="cat-nav-inner" id="catNavMobile"></div></nav>
<div class="trending-bar"><div class="trending-inner" id="trendChips"></div></div>

<div class="site-layout">
  <main class="site-main">
    <div id="pageWrap" class="fade-in"></div>
    <div id="loadMoreWrap" style="display:none; text-align:center; padding:32px">
      <button class="lorandite-btn" style="margin:0 auto; padding:.8rem 2rem" onclick="loadMore()">Вчитај повеќе ↓</button>
    </div>
  </main>
  <aside class="site-sidebar">
    <div class="sidebar-inner">
      <h4 class="sidebar-title">
        <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.45l8.27 14.3H3.73L12 5.45zM11 16h2v2h-2v-2zm0-6h2v4h-2v-4z"/></svg>
        Најчитано
      </h4>
      <div id="sidebarPopular"></div>
    </div>
  </aside>
</div>

<footer>
  <strong style="font-family:var(--display); font-size:1.2rem; color:var(--headline); letter-spacing:.05em">ПРЕСЕК</strong>
  <p style="margin-top:8px; font-size:.9rem; opacity:0.6">Вашиот дневен преглед на македонски вести</p>
  <div class="footer-links">
    <a href="/izvori">Извори</a> · <a href="/stats">Статистики</a> · <a href="/about">За нас</a>
  </div>
</footer>

<script>
  let allClusters = [];
  let activeCategory = 'Сите';
  let _currentPage = 0;
  let _hasMore = false;
  const PAGE_SIZE = 50;

  function timeAgo(str) {
    if(!str) return '';
    const diff = (Date.now() - new Date(str)) / 1000;
    if(diff < 60) return 'сега';
    if(diff < 3600) return `${Math.floor(diff/60)}м`;
    if(diff < 86400) return `${Math.floor(diff/3600)}ч`;
    return `${Math.floor(diff/86400)}д`;
  }

  async function showTop10(btn) {
    if(btn) btn.style.opacity = '0.5';
    try {
      const res = await fetch('/api/top10');
      const data = await res.json();
      allClusters = data.clusters || data;
      _hasMore = false;
      renderPage(allClusters);
      document.getElementById('loadMoreWrap').style.display = 'none';
      window.scrollTo({top: 0, behavior: 'smooth'});
    } catch(e) {}
    if(btn) btn.style.opacity = '1';
  }

  function renderCard(c) {
    const a = c.articles[0];
    if(!a) return '';
    const isBreaking = (c.score || 0) > 3.0;

    return `
      <div class="story-card fade-in">
        <div style="display:flex; gap:20px; justify-content:space-between">
          <div style="flex:1">
            <div class="story-meta">
              <span style="color:var(--gold)">${a.source}</span>
              <span style="opacity:0.5">|</span>
              <span>${timeAgo(a.created_at)}</span>
              ${isBreaking ? '<span style="color:var(--accent)">| ВО ЖИВО</span>' : ''}
            </div>
            <h3 class="story-headline">
              <a href="/cluster/${c.cluster_id}">${a.headline || a.title}</a>
            </h3>
          </div>
          <div class="story-thumb-wrap">
            <img src="${a.image_url || '/static/logo.png'}" class="story-thumb" loading="lazy" style="${!a.image_url ? 'object-fit: contain; padding: 10px; opacity: 0.2;' : ''}">
          </div>
        </div>
        <p style="font-size:var(--font-size-sm); color:var(--text-body); opacity:0.8; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden">${a.description || ''}</p>
        <div style="margin-top:auto; padding-top:12px; display:flex; align-items:center; gap:12px">
          <span class="badge-count">${c.articles.length} извори</span>
        </div>
      </div>
    `;
  }

  function renderPage(clusters) {
    const wrap = document.getElementById('pageWrap');
    let filtered = activeCategory === 'Сите' ? clusters : clusters.filter(c => c.articles[0]?.category === activeCategory);
    wrap.innerHTML = `<div class="stories-grid">${filtered.map(renderCard).join('')}</div>`;
  }

  async function fetchNews() {
    const btn = document.getElementById('refreshBtn');
    if(btn) btn.style.opacity = '0.5';
    try {
      const res = await fetch(`/api/news?page=0&page_size=${PAGE_SIZE}`);
      const data = await res.json();
      allClusters = data.clusters || data;
      _hasMore = data.has_more;
      renderPage(allClusters);
      updateTicker(allClusters);
      buildCats();
      document.getElementById('loadMoreWrap').style.display = _hasMore ? 'block' : 'none';
    } catch(e) {}
    if(btn) btn.style.opacity = '1';
  }

  async function loadMore() {
    _currentPage++;
    try {
      const res = await fetch(`/api/news?page=${_currentPage}&page_size=${PAGE_SIZE}`);
      const data = await res.json();
      allClusters = [...allClusters, ...(data.clusters || [])];
      _hasMore = data.has_more;
      renderPage(allClusters);
      document.getElementById('loadMoreWrap').style.display = _hasMore ? 'block' : 'none';
    } catch(e) {}
  }

  function updateTicker(clusters) {
    const items = clusters.slice(0, 15).map(c => `<span>${c.articles[0]?.title}</span>`);
    document.getElementById('tickerInner').innerHTML = [...items, ...items].join('');
  }

  function buildCats() {
    const cats = ['Сите', 'Македонија', 'Балкан', 'Европа', 'Германија', 'Америка', 'Свет'];
    document.getElementById('catNavMobile').innerHTML = cats.map(c => 
      `<button class="cat-btn ${c===activeCategory?'active':''}" onclick="filterCat('${c}')">${c}</button>`
    ).join('');
  }

  function filterCat(cat) {
    activeCategory = cat;
    buildCats();
    renderPage(allClusters);
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  async function fetchPopular() {
    try {
      const res = await fetch('/api/popular');
      const data = await res.json();
      document.getElementById('sidebarPopular').innerHTML = data.slice(0, 15).map(c => `
        <div style="margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:12px">
          <a href="/cluster/${c.cluster_id}" style="color:var(--headline); text-decoration:none; font-size:var(--font-size-sm); font-weight:700; line-height:1.4; display:block; transition:color .2s">${c.articles[0].title}</a>
          <div style="font-size:.65rem; color:var(--bronze); margin-top:4px; text-transform:uppercase; font-weight:700">${c.articles[0].source} · ${timeAgo(c.articles[0].created_at)}</div>
        </div>
      `).join('');
    } catch(e) {}
  }

  async function fetchTrending() {
    try {
      const res = await fetch('/api/trending');
      const data = await res.json();
      document.getElementById('trendChips').innerHTML = data.slice(0, 10).map(t => `
        <span class="trend-chip" onclick="filterByTrend('${t.word}')">#${t.word}</span>
      `).join('');
    } catch(e) {}
  }

  function filterByTrend(word) {
    const lower = word.toLowerCase();
    const filtered = allClusters.filter(c => c.articles.some(a => (a.title + a.description).toLowerCase().includes(lower)));
    renderPage(filtered);
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  fetchNews(); fetchPopular(); fetchTrending();
</script>
</body>
</html>
