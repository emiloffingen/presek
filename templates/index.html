{% extends "base.html" %}

{% block title %}Пресек | Вашиот Дневен Преглед{% endblock %}

{% block head %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Пресек",
    "url": "https://presek.mk/",
    "description": "Најнапреден македонски агрегатор на вести. Групирање со вештачка интелигенција, длабинска анализа и објективни резимеа.",
    "potentialAction": {
        "@type": "SearchAction",
        "target": "https://presek.mk/?q={search_term_string}",
        "query-input": "required name=search_term_string"
    }
}
</script>
<style>
    /* Page Specific Styles */
    .nav-bar {
        position: sticky;
        top: 64px;
        z-index: 900;
        background: rgba(15, 17, 19, 0.8);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        margin-bottom: var(--space-lg);
    }
    html.light .nav-bar { background: rgba(245, 247, 249, 0.8); }

    .nav-inner {
        max-width: var(--max-width);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-xs) var(--space-md);
    }

    .category-scroll {
        display: flex;
        gap: var(--space-xs);
        overflow-x: auto;
        padding: 4px;
        scrollbar-width: none;
        mask-image: linear-gradient(to right, black calc(100% - 40px), transparent);
        -webkit-mask-image: linear-gradient(to right, black calc(100% - 40px), transparent);
    }
    .category-scroll.scrolled-end {
        mask-image: linear-gradient(to left, black calc(100% - 40px), transparent);
        -webkit-mask-image: linear-gradient(to left, black calc(100% - 40px), transparent);
    }
    .category-scroll.scrolled-mid {
        mask-image: linear-gradient(to right, transparent, black 40px, black calc(100% - 40px), transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 40px, black calc(100% - 40px), transparent);
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: var(--weight-semi);
        padding: 10px 18px;
        border-radius: var(--radius-md);
        white-space: nowrap;
        cursor: pointer;
        transition: var(--transition);
    }
    .cat-btn:hover { 
        color: var(--text-primary); 
        background: var(--bg-surface-hover); 
    }
    .cat-btn.active { 
        background: var(--primary); 
        color: white; 
    }

    /* Trending Topics Bar */
    .trending-container {
        max-width: var(--max-width);
        margin: 0 auto var(--space-lg);
        padding: 0 var(--space-md);
        display: flex;
        align-items: center;
        gap: var(--space-md);
        overflow: hidden;
    }
    .trending-label {
        font-size: 0.65rem;
        font-weight: var(--weight-bold);
        text-transform: uppercase;
        color: var(--primary);
        letter-spacing: 0.1em;
        white-space: nowrap;
    }
    .trending-scroll {
        display: flex;
        gap: var(--space-sm);
        overflow-x: auto;
        scrollbar-width: none;
        padding: 4px 0;
    }
    .trending-scroll::-webkit-scrollbar { display: none; }
    .trend-tag {
        font-size: 0.8rem;
        color: var(--text-secondary);
        background: var(--bg-surface);
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid var(--border);
        white-space: nowrap;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .trend-tag:hover, .trend-tag.active {
        border-color: var(--primary);
        color: var(--text-primary);
    }
    .trend-tag.active {
        background: var(--primary);
        color: white !important;
        border-color: var(--primary);
    }
    .follow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); display: none; }
    .trend-tag.followed .follow-dot { display: block; }

    /* Follow button on topic tags */
    .follow-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0;
        margin-left: 2px;
        display: flex;
        align-items: center;
        transition: var(--transition);
        opacity: 0.5;
    }
    .follow-btn:hover { opacity: 1; color: var(--primary); }
    .trend-tag.followed .follow-btn { opacity: 1; color: var(--primary); }

    /* Error state */
    .error-state {
        text-align: center;
        padding: 80px var(--space-md);
        color: var(--text-muted);
    }
    .error-state p {
        margin-bottom: var(--space-lg);
        font-size: 1rem;
    }

    /* Collapsible filter toggle for mobile */
    .filter-toggle {
        display: none;
        max-width: var(--max-width);
        margin: 0 auto;
        padding: 0 var(--space-md) var(--space-sm);
    }
    .filter-toggle-btn {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        font-size: 0.8rem;
        font-weight: var(--weight-semi);
        padding: 8px 16px;
        border-radius: var(--radius-md);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: var(--transition);
        width: 100%;
        justify-content: center;
    }
    .filter-toggle-btn:hover { border-color: var(--primary); }
    .filter-toggle-btn .arrow { transition: transform 0.2s; }
    .filter-toggle-btn.open .arrow { transform: rotate(180deg); }
    .filter-collapsible { transition: max-height 0.3s ease, opacity 0.2s ease; overflow: hidden; }

    @media (max-width: 768px) {
        .filter-toggle { display: block; }
        .filter-collapsible.collapsed {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
        }
        .filter-collapsible.expanded {
            max-height: 500px;
            opacity: 1;
        }
    }

    /* Hero Section */
    .hero-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        grid-template-rows: repeat(2, 1fr);
        gap: var(--space-md);
        max-width: var(--max-width);
        margin: 0 auto var(--space-2xl);
        padding: 0 var(--space-md);
        height: 500px;
    }
    .hero-item {
        position: relative;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--bg-surface);
        border: 1px solid var(--border);
    }
    .hero-item.large { grid-row: 1 / span 2; }
    .hero-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; }
    .hero-item:hover .hero-img { transform: scale(1.05); }
    .hero-overlay {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        padding: var(--space-xl);
        background: linear-gradient(transparent, rgba(0,0,0,0.9));
        color: white;
    }
    .hero-item.small .hero-overlay { padding: var(--space-lg); }
    .hero-title-text { font-family: var(--font-heading); line-height: 1.2; margin-bottom: var(--space-sm); }
    .hero-item.large .hero-title-text { font-size: 2rem; }
    .hero-item.small .hero-title-text { font-size: 1.1rem; }

    .time-divider {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: var(--space-md);
        margin: var(--space-lg) 0 var(--space-sm);
        font-size: 0.7rem;
        font-weight: var(--weight-bold);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-muted);
    }
    .time-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .load-more-wrap {
        text-align: center;
        padding: var(--space-2xl) 0;
        min-height: 100px;
    }

    @media (max-width: 800px) {
        .hero-grid { grid-template-columns: 1fr; height: auto; }
        .hero-item.large { height: 300px; }
        .hero-item.small { height: 200px; }
    }

    /* Skeleton Loading - 2026 Standard */
    .skeleton-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: var(--space-lg);
    }
    .skeleton-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-lg);
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
    }
    .skeleton-box {
        background: var(--border);
        border-radius: var(--radius-md);
        animation: skeleton-pulse 1.8s infinite ease-in-out;
    }
    @keyframes skeleton-pulse {
        0% { opacity: 0.4; }
        50% { opacity: 0.8; }
        100% { opacity: 0.4; }
    }
</style>
{% endblock %}

{% block content %}
<nav class="nav-bar">
    <div class="nav-inner">
        <div class="category-scroll" id="categoryList">
            <!-- Populated by JS -->
        </div>
    </div>
</nav>

<!-- Hero Section for Top 3 -->
<div id="heroWrap" style="visibility:hidden; height:0; overflow:hidden">
    <div class="hero-grid" id="heroGrid"></div>
</div>

<!-- Filter toggle for mobile -->
<div class="filter-toggle">
    <button class="filter-toggle-btn" id="filterToggleBtn" onclick="toggleFilters()">
        Филтри
        <svg class="arrow" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
</div>

<div class="filter-collapsible collapsed" id="filterCollapsible">
    <!-- Regional Sub-filters -->
    <div class="trending-container" id="regionalSubBox" style="display:none; margin-bottom: var(--space-md);">
        <div class="trending-label">Град</div>
        <div class="trending-scroll" id="regionalSubList"></div>
    </div>

    <!-- Sentiment Filters -->
    <div class="trending-container" id="sentimentBox" style="margin-bottom: var(--space-md);">
        <div class="trending-label">Тон</div>
        <div class="trending-scroll">
            <div class="trend-tag active" id="sentAll" onclick="filterSentiment('')" data-sentiment="">Сите</div>
            <div class="trend-tag" id="sentPos" onclick="filterSentiment('🟢')" data-sentiment="🟢">🟢 Позитивни</div>
            <div class="trend-tag" id="sentCrit" onclick="filterSentiment('🔴')" data-sentiment="🔴">🔴 Критични</div>
        </div>
    </div>

    <!-- Topical Filters -->
    <div class="trending-container" id="topicBox" style="margin-bottom: var(--space-lg);">
        <div class="trending-label">Тема</div>
        <div class="trending-scroll" id="topicList">
            <!-- Populated by JS -->
        </div>
    </div>

    <div class="trending-container" id="trendingBox" style="display:none">
        <div class="trending-label">Во Тренд</div>
        <div class="trending-scroll" id="trendingList"></div>
    </div>

    <div class="trending-container" id="entitiesBox" style="display:none; margin-bottom: var(--space-xl);">
        <div class="trending-label">Личности</div>
        <div class="trending-scroll" id="entitiesList"></div>
    </div>
</div>

<div id="pageWrap">
    <!-- Initial Skeleton Loader for Perceived Performance -->
    <div class="skeleton-grid">
        {% for i in range(6) %}
        <div class="skeleton-card">
            <div class="skeleton-box" style="aspect-ratio: 16/9; width: 100%;"></div>
            <div class="skeleton-box" style="height: 12px; width: 30%;"></div>
            <div class="skeleton-box" style="height: 28px; width: 90%;"></div>
            <div class="skeleton-box" style="height: 60px; width: 100%;"></div>
        </div>
        {% endfor %}
    </div>
</div>

<div id="loadMoreWrap" class="load-more-wrap" style="display:none">
    <button class="page-btn" onclick="loadMore()">Вчитај повеќе</button>
</div>
{% endblock %}

{% block scripts %}
<script>
    let activeCategory = '🇲🇰';
    let activeSubcategory = '';
    let activeTopic = '';
    let activeSentiment = '';
    let _currentPage = 0;
    let _hasMore = false;
    let _isFetching = false;
    let allClusters = [];
    const PAGE_SIZE = 50;

    const countries = [
        { id: '🇲🇰', label: 'Македонија' },
        { id: 'FOLLOWING', label: 'За Мене' },
        { id: 'POPULAR', label: 'Популарно' },
        { id: 'SAVED', label: 'Зачувано' },
        { id: 'REG', label: 'Регионално' },
        { id: '🇩🇪', label: 'Германија' },
        { id: '🇷🇸', label: 'Србија' },
        { id: '🇺🇸', label: 'САД' },
        { id: '🇧🇬', label: 'Бугарија' },
        { id: '🇬🇷', label: 'Грција' },
        { id: '🇦🇱', label: 'Албанија' },
        { id: '🇨🇭', label: 'Швајцарија' },
        { id: '🇹🇷', label: 'Турција' }
    ];

    let topics = [
        { id: '', label: 'Сите Теми' },
        { id: 'Политика', label: 'Политика' },
        { id: 'Економија', label: 'Економија' },
        { id: 'Технологија', label: 'Технологија' },
        { id: 'Спорт', label: 'Спорт' },
        { id: 'Забава', label: 'Забава' },
        { id: 'Здравје', label: 'Здравје' }
    ];

    async function fetchTopics() {
        try {
            const res = await fetch('/api/stats');
            const data = await res.json();
            if (data.by_category) {
                const fetched = data.by_category
                    .filter(c => c.category && c.category !== 'Македонија')
                    .map(c => ({ id: c.category, label: c.category }));
                // Merge with hardcoded to ensure we have standard ones even if empty
                const unique = new Set(topics.map(t => t.id));
                fetched.forEach(f => {
                    if (!unique.has(f.id)) {
                        topics.push(f);
                        unique.add(f.id);
                    }
                });
                initCategories();
            }
        } catch(e) { console.error("Topic fetch error", e); }
    }

    function initCategories() {
        const list = document.getElementById('categoryList');
        list.innerHTML = countries.map(c => `
            <button class="cat-btn ${c.id === activeCategory ? 'active' : ''}" onclick="filterCat('${c.id}')">
                ${c.id === 'REG' ? '📍' : (c.id === 'SAVED' ? '🔖' : (c.id === 'POPULAR' ? '🔥' : (c.id === 'FOLLOWING' ? '✨' : c.id)))} ${c.label}
            </button>
        `).join('');

        // Regional sub-filters
        const subBox = document.getElementById('regionalSubBox');
        if (activeCategory === 'REG') {
            subBox.style.display = 'flex';
            const cities = ["Скопје", "Битола", "Охрид", "Прилеп", "Куманово", "Тетово", "Штип", "Велес", "Гостивар", "Струмица", "Кавадарци"];
            document.getElementById('regionalSubList').innerHTML = cities.map(city => `
                <div class="trend-tag ${activeSubcategory === city ? 'active' : ''}" onclick="filterSub('${city}')">${city}</div>
            `).join('');
        } else {
            subBox.style.display = 'none';
        }

        // Topics
        const topicList = document.getElementById('topicList');
        topicList.innerHTML = topics.map(t => {
            const followed = isFollowing('topics', t.id);
            return `
                <div class="trend-tag ${activeTopic === t.id ? 'active' : ''} ${followed ? 'followed' : ''}" 
                     onclick="filterTopic('${t.id}')" 
                     oncontextmenu="event.preventDefault(); toggleFollow('topics', '${t.id}'); initCategories();">
                    <div class="follow-dot"></div>
                    ${t.label}
                </div>
            `;
        }).join('');
        
        // Sentiment
        document.querySelectorAll('#sentimentBox .trend-tag').forEach(tag => tag.classList.remove('active'));
        if (!activeSentiment) document.getElementById('sentAll').classList.add('active');
        else if (activeSentiment === '🟢') document.getElementById('sentPos').classList.add('active');
        else if (activeSentiment === '🔴') document.getElementById('sentCrit').classList.add('active');
    }

    function filterSentiment(s) {
        activeSentiment = s;
        _currentPage = 0;
        initCategories();
        fetchNews();
    }

    function renderHero(clusters) {
        const wrap = document.getElementById('heroWrap');
        const grid = document.getElementById('heroGrid');
        if (activeCategory !== '🇲🇰' || activeTopic || activeSentiment || activeSubcategory || _currentPage > 0) {
            wrap.style.visibility = 'hidden'; wrap.style.height = '0'; wrap.style.overflow = 'hidden';
            return;
        }

        const top3 = clusters
            .filter(c => c.articles.some(art => art.image_url))
            .slice(0, 3);
        if (top3.length < 3) {
            wrap.style.visibility = 'hidden'; wrap.style.height = '0'; wrap.style.overflow = 'hidden';
            return;
        }

        wrap.style.visibility = 'visible'; wrap.style.height = 'auto'; wrap.style.overflow = 'visible';
        grid.innerHTML = top3.map((c, i) => {
            const a = c.articles[0];
            const heroArt = c.articles.find(art => art.image_url);
            const heroImg = heroArt ? heroArt.image_url : '/static/img/placeholder.svg';
            const sizeClass = i === 0 ? 'large' : 'small';
            const imgSrc = heroImg.startsWith('/') ? heroImg : '/proxy?url=' + encodeURIComponent(heroImg);
            return `
                <a href="/cluster/${c.cluster_id}" class="hero-item ${sizeClass}">
                    <img src="${imgSrc}" class="hero-img" loading="lazy" alt="${a.title}">
                    <div class="hero-overlay">
                        <div class="story-meta" style="color:rgba(255,255,255,0.8); margin-bottom:8px">
                            <span>${a.source}</span> • <span>${new Date(a.created_at).toLocaleTimeString('mk-MK', {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                        <h2 class="hero-title-text">${a.title}</h2>
                    </div>
                </a>
            `;
        }).join('');
    }

    function renderPage(clusters) {
        try {
            const wrap = document.getElementById('pageWrap');
            if (!clusters || !clusters.length) {
                wrap.innerHTML = `<div style="text-align:center; padding:100px; color:var(--text-muted)">
                    ${activeCategory === 'SAVED' ? 'Немате зачувано вести.' : (activeCategory === 'FOLLOWING' ? 'Не следите ниту еден извор или тема. Одете на профилот на изворот или десен клик на тема за да почнете да следите.' : 'Нема вести за избраната категорија.')}
                </div>`;
                return;
            }

            // ── Presek 3.0: Bento Grid Engine ──
            let html = '<div class="bento-grid">';
            
            clusters.forEach((c, idx) => {
                let size = 'bento-standard';
                const hasImage = c.articles && c.articles.some(a => a.image_url);
                const score = c.score || 0;
                const threshold = (typeof BREAKING_SCORE_THRESHOLD !== 'undefined') ? BREAKING_SCORE_THRESHOLD : 3.0;

                // First item on domestic page is always Large if it has an image
                if (idx === 0 && (activeCategory === '🇲🇰' || !activeCategory) && hasImage && _currentPage === 0) {
                    size = 'bento-large';
                } 
                // Breaking news with images get Wide slots
                else if (score >= threshold && hasImage && idx < 10) {
                    size = 'bento-wide';
                }
                // Visual rhythm: Tall tiles for variety
                else if (idx % 5 === 4 && hasImage) {
                    size = 'bento-tall';
                }
                // Wide tiles every 8 items for horizontal breaks
                else if (idx % 8 === 0 && hasImage && idx > 0) {
                    size = 'bento-wide';
                }

                if (typeof renderBentoTile === 'function') {
                    html += renderBentoTile(c, size);
                } else if (typeof renderCard === 'function') {
                    html += renderCard(c, idx);
                }
            });
            
            html += '</div>';
            wrap.innerHTML = html;
            
            // Hide legacy hero wrap if it exists
            const oldHero = document.getElementById('heroWrap');
            if (oldHero) { 
                oldHero.style.display = 'none'; 
                oldHero.style.visibility = 'hidden';
                oldHero.style.height = '0';
            }
        } catch (err) {
            console.error("renderPage failed:", err);
            document.getElementById('pageWrap').innerHTML = '<div style="text-align:center; padding:50px; color:var(--text-muted)">Настана грешка при прикажување на вестите.</div>';
        }
    }

    async function fetchNews(isLoadMore = false) {
        if (_isFetching) return;
        _isFetching = true;

        if (!isLoadMore) {
            _currentPage = 0;
            allClusters = [];
            document.getElementById('pageWrap').innerHTML = `
                <div class="bento-grid">
                    <div class="skeleton-card bento-large"></div>
                    <div class="skeleton-card bento-standard"></div>
                    <div class="skeleton-card bento-standard"></div>
                    <div class="skeleton-card bento-wide"></div>
                    <div class="skeleton-card bento-standard"></div>
                    <div class="skeleton-card bento-tall"></div>
                    <div class="skeleton-card bento-standard"></div>
                    <div class="skeleton-card bento-standard"></div>
                </div>
            `;
        }

        try {
            let url = `/api/news?page=${_currentPage}&page_size=${PAGE_SIZE}&topic=${encodeURIComponent(activeTopic)}&sentiment=${encodeURIComponent(activeSentiment)}`;
            if (activeCategory === 'REG') {
                url += `&country=${encodeURIComponent('Македонија')}&sub=${encodeURIComponent(activeSubcategory)}`;
            } else if (activeCategory === 'SAVED') {
                const bookmarks = getBookmarks();
                if (!bookmarks.length) {
                    renderPage([]);
                    _isFetching = false;
                    _hasMore = false;
                    document.getElementById('loadMoreWrap').style.display = 'none';
                    return;
                }
                url += `&ids=${encodeURIComponent(bookmarks.join(','))}`;
            } else if (activeCategory === 'FOLLOWING') {
                const follows = getFollowing();
                if (!follows.sources.length && !follows.topics.length) {
                    renderPage([]);
                    _isFetching = false;
                    _hasMore = false;
                    document.getElementById('loadMoreWrap').style.display = 'none';
                    return;
                }
                url += `&follow_sources=${encodeURIComponent(follows.sources.join(','))}&follow_topics=${encodeURIComponent(follows.topics.join(','))}`;
            } else if (activeCategory === 'POPULAR') {
                url += `&sort=popular`;
            } else {
                url += `&country=${encodeURIComponent(activeCategory)}`;
            }
            
            const res = await fetch(url);
            const data = await res.json();
            
            if (isLoadMore) {
                allClusters = [...allClusters, ...data.clusters];
            } else {
                allClusters = data.clusters;
            }
            renderPage(allClusters);
            
            _hasMore = data.has_more;
            document.getElementById('loadMoreWrap').style.display = _hasMore ? 'block' : 'none';
        } catch(e) {
            console.error(e);
        } finally {
            _isFetching = false;
        }
    }

    function filterCat(cat) {
        activeCategory = cat;
        activeSubcategory = '';
        _currentPage = 0;
        initCategories();
        fetchNews();
    }

    function filterSub(sub) {
        activeSubcategory = sub;
        _currentPage = 0;
        initCategories();
        fetchNews();
    }

    function filterTopic(topic) {
        activeTopic = topic;
        _currentPage = 0;
        initCategories();
        fetchNews();
    }

    function filterSentiment(s) {
        activeSentiment = s;
        _currentPage = 0;
        initCategories();
        fetchNews();
    }

    function loadMore() {
        if (_hasMore && !_isFetching) {
            _currentPage++;
            fetchNews(true);
        }
    }

    // Refresh views if follow state changes
    window.addEventListener('followingUpdated', () => {
        initCategories();
        if (activeCategory === 'FOLLOWING') fetchNews();
    });

    window.addEventListener('bookmarksUpdated', () => {
        if (activeCategory === 'SAVED') fetchNews();
    });

    // Infinite Scroll Intersection Observer
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && _hasMore && !_isFetching) {
            loadMore();
        }
    }, { threshold: 0.1, rootMargin: '400px' });

    document.addEventListener('DOMContentLoaded', () => {
        const sentinel = document.getElementById('loadMoreWrap');
        if (sentinel) observer.observe(sentinel);
    });

    async function fetchTrending() {
        try {
            const res = await fetch('/api/trending');
            const data = await res.json();
            const list = document.getElementById('trendingList');
            if (data && data.length) {
                document.getElementById('trendingBox').style.display = 'flex';
                list.innerHTML = data.map(t => {
                    const q = t.word.replace(/'/g, "\\'");
                    return `<div class="trend-tag" onclick="searchTrend('${q}')">${esc(t.word)}</div>`;
                }).join('');
            }
        } catch(e) { console.error("Trending error", e); }
    }

    function searchTrend(q) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        const searchOpen = document.getElementById('searchOpen');
        const searchInput = document.getElementById('searchInput');
        if (searchOpen && searchInput) {
            if (!document.getElementById('searchOverlay').classList.contains('active')) {
                searchOpen.click();
            }
            searchInput.value = q;
            searchInput.focus();
            searchInput.dispatchEvent(new Event('input'));
        }
    }

    async function fetchEntities() {
        try {
            const res = await fetch('/api/trending/entities');
            const data = await res.json();
            const list = document.getElementById('entitiesList');
            if (data && data.length) {
                document.getElementById('entitiesBox').style.display = 'flex';
                list.innerHTML = data.map(e => {
                    const name = e.entity_name;
                    const q = name.replace(/'/g, "\\'");
                    return `
                    <div class="trend-tag" onclick="searchTrend('${q}')">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                            ${e.entity_type === 'PERSON' ? '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>' : '<rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>'}
                        </svg>
                        ${esc(name)}
                    </div>`;
                }).join('');
            }
        } catch(e) { console.error("Entities error", e); }
    }

    // Category scroll fade mask based on scroll position
    function updateScrollMask() {
        const el = document.getElementById('categoryList');
        if (!el) return;
        const atStart = el.scrollLeft <= 10;
        const atEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 10;
        el.classList.remove('scrolled-end', 'scrolled-mid');
        if (atStart && atEnd) {
            el.style.maskImage = 'none';
            el.style.webkitMaskImage = 'none';
        } else if (atEnd) {
            el.classList.add('scrolled-end');
        } else if (!atStart) {
            el.classList.add('scrolled-mid');
        }
    }
    document.getElementById('categoryList').addEventListener('scroll', updateScrollMask);
    setTimeout(updateScrollMask, 100);

    // ── Presek 2.0: Real-time Live Updates (SSE) ──
    function initLiveUpdates() {
        const source = new EventSource('/api/live');
        source.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'new_articles') {
                    showNewContentToast(data.count);
                }
            } catch(e) { console.error("SSE parse error", e); }
        };
        source.onerror = function() {
            source.close();
            setTimeout(initLiveUpdates, 10000); // Retry after 10s
        };
    }

    function showNewContentToast(count) {
        // Only show if user is on the first page of 'Македонија'
        if (_currentPage !== 0 || activeCategory !== '🇲🇰' || activeTopic || activeSentiment) return;
        
        const existing = document.getElementById('liveToast');
        if (existing) existing.remove();
        
        const toast = document.createElement('div');
        toast.id = 'liveToast';
        toast.className = 'fade-in';
        toast.style = `
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: white; padding: 10px 24px;
            border-radius: 30px; font-weight: bold; cursor: pointer; z-index: 1500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px;
        `;
        toast.innerHTML = `✨ <b>${count}</b> нови вести. Вчитај освежување.`;
        toast.onclick = () => {
            toast.remove();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            fetchNews();
        };
        document.body.appendChild(toast);
        
        // Auto-remove after 30s
        setTimeout(() => toast.remove(), 30000);
    }

    initCategories();
    fetchTopics();
    fetchNews();
    fetchTrending();
    fetchEntities();
    initLiveUpdates();
</script>
{% endblock %}
