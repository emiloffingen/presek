{% extends "base.html" %}

{% block title %}Пресек | Вашиот Дневен Преглед{% endblock %}

{% block head %}
<style>
    /* Page Specific Styles */
    .hero-section {
        padding: var(--space-2xl) 0;
        text-align: center;
        border-bottom: 1px solid var(--border);
        margin-bottom: var(--space-xl);
    }
    .hero-title {
        font-size: clamp(2rem, 6vw, 3.5rem);
        margin-bottom: var(--space-sm);
        letter-spacing: -0.03em;
    }
    .hero-subtitle {
        color: var(--text-secondary);
        font-size: 1.15rem;
        max-width: 600px;
        margin: 0 auto;
        line-height: var(--lh-base);
    }

    .nav-bar {
        position: sticky;
        top: 64px;
        z-index: 900;
        background: rgba(15, 17, 19, 0.8);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        margin-bottom: var(--space-lg);
    }
    html.light .nav-bar { background: rgba(245, 247, 249, 0.8); }

    .nav-inner {
        max-width: var(--max-width);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-xs) var(--space-md);
    }

    .category-scroll {
        display: flex;
        gap: var(--space-xs);
        overflow-x: auto;
        padding: 4px;
        scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: var(--weight-semi);
        padding: 10px 18px;
        border-radius: var(--radius-md);
        white-space: nowrap;
        cursor: pointer;
        transition: var(--transition);
    }
    .cat-btn:hover { 
        color: var(--text-primary); 
        background: var(--bg-surface-hover); 
    }
    .cat-btn.active { 
        background: var(--primary); 
        color: white; 
    }

    .time-divider {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: var(--space-md);
        margin: var(--space-lg) 0 var(--space-sm);
        font-size: 0.7rem;
        font-weight: var(--weight-bold);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-muted);
    }
    .time-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .load-more-wrap {
        text-align: center;
        padding: var(--space-2xl) 0;
    }
    .load-more-btn {
        background: var(--bg-surface);
        color: var(--text-primary);
        border: 1px solid var(--border);
        padding: 12px 32px;
        border-radius: var(--radius-md);
        font-weight: var(--weight-semi);
        cursor: pointer;
        transition: var(--transition);
    }
    .load-more-btn:hover {
        border-color: var(--primary);
        transform: translateY(-1px);
    }

    /* Skeleton Loading */
    .skeleton-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: var(--space-lg);
    }
    .skeleton-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-lg);
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
    }
    .skeleton-box {
        background: var(--border);
        border-radius: var(--radius-md);
        animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.8; }
    }
</style>
{% endblock %}

{% block content %}
<section class="hero-section fade-in">
    <h1 class="hero-title">Македонски <span style="color:var(--primary)">Пресек</span></h1>
    <p class="hero-subtitle">Сите македонски и светски вести, групирани и сумирани од вештачка интелигенција.</p>
</section>

<nav class="nav-bar">
    <div class="nav-inner">
        <div class="category-scroll" id="categoryList">
            <!-- Populated by JS -->
        </div>
    </div>
</nav>

<div id="pageWrap">
    <!-- Content Populated by JS -->
</div>

<div id="loadMoreWrap" class="load-more-wrap" style="display:none">
    <button class="load-more-btn" onclick="loadMore()">Вчитај повеќе</button>
</div>
{% endblock %}

{% block scripts %}
<script>
    let activeCategory = '🇲🇰';
    let _currentPage = 0;
    let _hasMore = false;
    let allClusters = [];
    const PAGE_SIZE = 50;

    const countries = [
        { id: '🇲🇰', label: 'Македонија' },
        { id: '🇩🇪', label: 'Германија' },
        { id: '🇷🇸', label: 'Србија' },
        { id: '🇺🇸', label: 'САД' },
        { id: '🇧🇬', label: 'Бугарија' },
        { id: '🇬🇷', label: 'Грција' },
        { id: '🇦🇱', label: 'Албанија' },
        { id: '🇨🇭', label: 'Швајцарија' },
        { id: '🇹🇷', label: 'Турција' }
    ];

    function initCategories() {
        const list = document.getElementById('categoryList');
        list.innerHTML = countries.map(c => `
            <button class="cat-btn ${c.id === activeCategory ? 'active' : ''}" onclick="filterCat('${c.id}')">
                ${c.id} ${c.label}
            </button>
        `).join('');
    }

    function timeAgo(str) {
        if(!str) return '';
        const diff = (Date.now() - new Date(str)) / 1000;
        if(diff < 60) return 'сега';
        if(diff < 3600) return `${Math.floor(diff/60)}м`;
        if(diff < 86400) return `${Math.floor(diff/3600)}ч`;
        return `${Math.floor(diff/86400)}д`;
    }

    function renderCard(c, index) {
        if(!c || !c.articles || !c.articles.length) return '';
        const a = c.articles[0];
        let clusterImage = null;
        for (let art of c.articles) {
            if (art.image_url) { clusterImage = art.image_url; break; }
        }

        const isBreaking = (c.score || 0) > BREAKING_SCORE_THRESHOLD;
        const uniqueSources = [...new Set(c.articles.map(art => art.source))];
        const topSources = uniqueSources.slice(0, 3);
        const moreCount = uniqueSources.length - topSources.length;

        return `
            <article class="story-card fade-in" style="animation-delay: ${index * 0.03}s">
                ${isBreaking ? '<div class="is-breaking"></div>' : ''}
                ${clusterImage ? `
                    <div class="story-thumb-wrap">
                        <img src="${clusterImage}" class="story-thumb" loading="lazy" alt="${a.title}">
                    </div>
                ` : `
                    <div class="story-thumb-placeholder">
                        <img src="/static/logo.svg" alt="Presek Logo">
                    </div>
                `}
                <div class="story-meta">
                    <span class="source">${a.source}</span>
                    <span>•</span>
                    <span>${timeAgo(a.created_at)}</span>
                    ${a.is_translated ? '<span class="translated-badge">AI ПРЕВОД</span>' : ''}
                </div>
                <h3 class="story-headline">
                    <a href="/cluster/${c.cluster_id}">${a.headline || a.title}</a>
                </h3>
                <p class="story-excerpt">${a.description || ''}</p>
                <div class="source-ribbon">
                    <div style="display:flex; gap:8px">
                        ${topSources.map(s => `<span class="source-tag">${s}</span>`).join('')}
                    </div>
                    ${moreCount > 0 ? `<span class="source-tag" style="opacity:0.5">+${moreCount}</span>` : ''}
                </div>
            </article>
        `;
    }

    function renderPage(clusters) {
        const wrap = document.getElementById('pageWrap');
        if (!clusters || !clusters.length) {
            wrap.innerHTML = '<div style="text-align:center; padding:100px; color:var(--text-muted)">Нема вести за избраната категорија.</div>';
            return;
        }

        const periodMap = {};
        clusters.forEach(c => {
            const h = new Date(c.articles[0].created_at).getHours();
            let key = '🌃 Ноќ';
            if (h >= 6 && h < 12) key = '🌅 Утро';
            else if (h >= 12 && h < 18) key = '☀️ Попладне';
            else if (h >= 18) key = '🌙 Вечер';
            
            if (!periodMap[key]) periodMap[key] = [];
            periodMap[key].push(c);
        });

        let html = '<div class="stories-grid">';
        const order = ['🌅 Утро', '☀️ Попладне', '🌙 Вечер', '🌃 Ноќ'];
        order.forEach(period => {
            if (periodMap[period]) {
                html += `<div class="time-divider"><span>${period}</span></div>`;
                periodMap[period].forEach((c, idx) => {
                    html += renderCard(c, idx);
                });
            }
        });
        html += '</div>';
        wrap.innerHTML = html;
    }

    async function fetchNews(isLoadMore = false) {
        if (!isLoadMore) {
            document.getElementById('pageWrap').innerHTML = `
                <div class="skeleton-grid">
                    ${'<div class="skeleton-card"><div class="skeleton-box" style="height:160px"></div><div class="skeleton-box" style="height:24px;width:80%"></div><div class="skeleton-box" style="height:60px"></div></div>'.repeat(6)}
                </div>
            `;
        }

        try {
            const res = await fetch(`/api/news?page=${_currentPage}&page_size=${PAGE_SIZE}&country=${encodeURIComponent(activeCategory)}`);
            const data = await res.json();
            
            if (isLoadMore) {
                allClusters = [...allClusters, ...data.clusters];
                renderPage(allClusters);
            } else {
                allClusters = data.clusters;
                renderPage(allClusters);
            }
            
            _hasMore = data.has_more;
            document.getElementById('loadMoreWrap').style.display = _hasMore ? 'block' : 'none';
        } catch(e) {
            console.error(e);
        }
    }

    function filterCat(cat) {
        activeCategory = cat;
        _currentPage = 0;
        initCategories();
        fetchNews();
    }

    function loadMore() {
        _currentPage++;
        fetchNews(true);
    }

    // Set breaking score from config
    const BREAKING_SCORE_THRESHOLD = 3.0;

    initCategories();
    fetchNews();
</script>
{% endblock %}
