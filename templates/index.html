{% extends "base.html" %}

{% block title %}Пресек | Вашиот Дневен Преглед{% endblock %}

{% block head %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Пресек",
    "url": "https://presek.mk/",
    "description": "Најнапреден македонски агрегатор на вести. Групирање со вештачка интелигенција, длабинска анализа и објективни резимеа.",
    "potentialAction": {
        "@type": "SearchAction",
        "target": "https://presek.mk/?q={search_term_string}",
        "query-input": "required name=search_term_string"
    }
}
</script>
<style>
    /* Page Specific Styles */
    .nav-bar {
        position: sticky;
        top: 64px;
        z-index: 900;
        background: rgba(15, 17, 19, 0.8);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        margin-bottom: var(--space-lg);
    }
    html.light .nav-bar { background: rgba(245, 247, 249, 0.8); }

    .nav-inner {
        max-width: var(--max-width);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-xs) var(--space-md);
    }

    .category-scroll {
        display: flex;
        gap: var(--space-xs);
        overflow-x: auto;
        padding: 4px;
        scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: var(--weight-semi);
        padding: 10px 18px;
        border-radius: var(--radius-md);
        white-space: nowrap;
        cursor: pointer;
        transition: var(--transition);
    }
    .cat-btn:hover { 
        color: var(--text-primary); 
        background: var(--bg-surface-hover); 
    }
    .cat-btn.active { 
        background: var(--primary); 
        color: white; 
    }

    /* Trending Topics Bar */
    .trending-container {
        max-width: var(--max-width);
        margin: 0 auto var(--space-lg);
        padding: 0 var(--space-md);
        display: flex;
        align-items: center;
        gap: var(--space-md);
        overflow: hidden;
    }
    .trending-label {
        font-size: 0.65rem;
        font-weight: var(--weight-bold);
        text-transform: uppercase;
        color: var(--primary);
        letter-spacing: 0.1em;
        white-space: nowrap;
    }
    .trending-scroll {
        display: flex;
        gap: var(--space-sm);
        overflow-x: auto;
        scrollbar-width: none;
        padding: 4px 0;
    }
    .trending-scroll::-webkit-scrollbar { display: none; }
    .trend-tag {
        font-size: 0.8rem;
        color: var(--text-secondary);
        background: var(--bg-surface);
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid var(--border);
        white-space: nowrap;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .trend-tag:hover, .trend-tag.active {
        border-color: var(--primary);
        color: var(--text-primary);
    }
    .trend-tag.active {
        background: var(--primary);
        color: white !important;
        border-color: var(--primary);
    }

    /* Error state */
    .error-state {
        text-align: center;
        padding: 80px var(--space-md);
        color: var(--text-muted);
    }
</style>
{% endblock %}

{% block content %}
<nav class="nav-bar">
    <div class="nav-inner">
        <div class="category-scroll" id="categoryList">
            <!-- Populated by UI.updateNav() -->
        </div>
    </div>
</nav>

<div class="trending-container" id="topicBox" style="margin-bottom: var(--space-lg);">
    <div class="trending-label">Тема</div>
    <div class="trending-scroll" id="topicList">
        <!-- Populated by UI.updateFilters() -->
    </div>
</div>

<div id="pageWrap">
    <!-- Initial Skeleton Loader -->
    <div class="bento-grid">
        <div class="skeleton-card bento-large"></div>
        <div class="skeleton-card bento-standard"></div>
        <div class="skeleton-card bento-wide"></div>
    </div>
</div>

<div id="loadMoreWrap" class="load-more-wrap" style="display:none">
    <button class="page-btn" onclick="Presek.state.page++; Presek.fetchNews(true)">Вчитај повеќе</button>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Page-specific initializers if any
</script>
{% endblock %}
