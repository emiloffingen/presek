{% extends "base.html" %}

{% block title %}Пресек | Вашиот Дневен Преглед{% endblock %}

{% block head %}
<style>
    /* Page Specific Styles */
    .nav-bar {
        position: sticky;
        top: 64px;
        z-index: 900;
        background: rgba(15, 17, 19, 0.8);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        margin-bottom: var(--space-lg);
    }
    html.light .nav-bar { background: rgba(245, 247, 249, 0.8); }

    .nav-inner {
        max-width: var(--max-width);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-xs) var(--space-md);
    }

    .category-scroll {
        display: flex;
        gap: var(--space-xs);
        overflow-x: auto;
        padding: 4px;
        scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: var(--weight-semi);
        padding: 10px 18px;
        border-radius: var(--radius-md);
        white-space: nowrap;
        cursor: pointer;
        transition: var(--transition);
    }
    .cat-btn:hover { 
        color: var(--text-primary); 
        background: var(--bg-surface-hover); 
    }
    .cat-btn.active { 
        background: var(--primary); 
        color: white; 
    }

    .time-divider {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: var(--space-md);
        margin: var(--space-lg) 0 var(--space-sm);
        font-size: 0.7rem;
        font-weight: var(--weight-bold);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-muted);
    }
    .time-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .load-more-wrap {
        text-align: center;
        padding: var(--space-2xl) 0;
        min-height: 100px;
    }
    .load-more-btn {
        background: var(--bg-surface);
        color: var(--text-primary);
        border: 1px solid var(--border);
        padding: 12px 32px;
        border-radius: var(--radius-md);
        font-weight: var(--weight-semi);
        cursor: pointer;
        transition: var(--transition);
    }
    .load-more-btn:hover {
        border-color: var(--primary);
        transform: translateY(-1px);
    }

    /* Skeleton Loading - 2026 Standard */
    .skeleton-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: var(--space-lg);
    }
    .skeleton-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-lg);
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
    }
    .skeleton-box {
        background: var(--border);
        border-radius: var(--radius-md);
        animation: skeleton-pulse 1.8s infinite ease-in-out;
    }
    @keyframes skeleton-pulse {
        0% { opacity: 0.4; }
        50% { opacity: 0.8; }
        100% { opacity: 0.4; }
    }
</style>
{% endblock %}

{% block content %}
<nav class="nav-bar">
    <div class="nav-inner">
        <div class="category-scroll" id="categoryList">
            <!-- Populated by JS -->
        </div>
    </div>
</nav>

<div id="pageWrap">
    <!-- Initial Skeleton Loader for Perceived Performance -->
    <div class="skeleton-grid">
        {% for i in range(6) %}
        <div class="skeleton-card">
            <div class="skeleton-box" style="aspect-ratio: 16/9; width: 100%;"></div>
            <div class="skeleton-box" style="height: 12px; width: 30%;"></div>
            <div class="skeleton-box" style="height: 28px; width: 90%;"></div>
            <div class="skeleton-box" style="height: 60px; width: 100%;"></div>
        </div>
        {% endfor %}
    </div>
</div>

<div id="loadMoreWrap" class="load-more-wrap" style="display:none">
    <button class="load-more-btn" onclick="loadMore()">Вчитај повеќе</button>
</div>
{% endblock %}

{% block scripts %}
<script>
    let activeCategory = '🇲🇰';
    let _currentPage = 0;
    let _hasMore = false;
    let _isFetching = false;
    let allClusters = [];
    const PAGE_SIZE = 50;

    const countries = [
        { id: '🇲🇰', label: 'Македонија' },
        { id: '🇩🇪', label: 'Германија' },
        { id: '🇷🇸', label: 'Србија' },
        { id: '🇺🇸', label: 'САД' },
        { id: '🇧🇬', label: 'Бугарија' },
        { id: '🇬🇷', label: 'Грција' },
        { id: '🇦🇱', label: 'Албанија' },
        { id: '🇨🇭', label: 'Швајцарија' },
        { id: '🇹🇷', label: 'Турција' }
    ];

    function initCategories() {
        const list = document.getElementById('categoryList');
        list.innerHTML = countries.map(c => `
            <button class="cat-btn ${c.id === activeCategory ? 'active' : ''}" onclick="filterCat('${c.id}')">
                ${c.id} ${c.label}
            </button>
        `).join('');
    }

    function renderPage(clusters) {
        const wrap = document.getElementById('pageWrap');
        if (!clusters || !clusters.length) {
            wrap.innerHTML = '<div style="text-align:center; padding:100px; color:var(--text-muted)">Нема вести за избраната категорија.</div>';
            return;
        }

        const periodMap = {};
        clusters.forEach(c => {
            const h = new Date(c.articles[0].created_at).getHours();
            let key = '🌃 Ноќ';
            if (h >= 6 && h < 12) key = '🌅 Утро';
            else if (h >= 12 && h < 18) key = '☀️ Попладне';
            else if (h >= 18) key = '🌙 Вечер';
            
            if (!periodMap[key]) periodMap[key] = [];
            periodMap[key].push(c);
        });

        let html = '<div class="stories-grid">';
        const order = ['🌅 Утро', '☀️ Попладне', '🌙 Вечер', '🌃 Ноќ'];
        order.forEach(period => {
            if (periodMap[period]) {
                html += `<div class="time-divider"><span>${period}</span></div>`;
                periodMap[period].forEach((c, idx) => {
                    html += renderCard(c, idx);
                });
            }
        });
        html += '</div>';
        wrap.innerHTML = html;
    }

    async function fetchNews(isLoadMore = false) {
        if (_isFetching) return;
        _isFetching = true;

        if (!isLoadMore) {
            _currentPage = 0;
            allClusters = [];
            document.getElementById('pageWrap').innerHTML = `
                <div class="skeleton-grid">
                    ${`
                        <div class="skeleton-card">
                            <div class="skeleton-box" style="aspect-ratio: 16/9; width: 100%;"></div>
                            <div class="skeleton-box" style="height: 12px; width: 30%;"></div>
                            <div class="skeleton-box" style="height: 28px; width: 90%;"></div>
                            <div class="skeleton-box" style="height: 60px; width: 100%;"></div>
                        </div>
                    `.repeat(6)}
                </div>
            `;
        }

        try {
            const res = await fetch(`/api/news?page=${_currentPage}&page_size=${PAGE_SIZE}&country=${encodeURIComponent(activeCategory)}`);
            const data = await res.json();
            
            if (isLoadMore) {
                allClusters = [...allClusters, ...data.clusters];
            } else {
                allClusters = data.clusters;
            }
            renderPage(allClusters);
            
            _hasMore = data.has_more;
            document.getElementById('loadMoreWrap').style.display = _hasMore ? 'block' : 'none';
        } catch(e) {
            console.error(e);
        } finally {
            _isFetching = false;
        }
    }

    function filterCat(cat) {
        activeCategory = cat;
        _currentPage = 0;
        initCategories();
        fetchNews();
    }

    function loadMore() {
        if (_hasMore && !_isFetching) {
            _currentPage++;
            fetchNews(true);
        }
    }

    // Infinite Scroll Intersection Observer
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && _hasMore && !_isFetching) {
            loadMore();
        }
    }, { threshold: 0.1, rootMargin: '400px' });

    document.addEventListener('DOMContentLoaded', () => {
        const sentinel = document.getElementById('loadMoreWrap');
        if (sentinel) observer.observe(sentinel);
    });

    initCategories();
    fetchNews();
</script>
{% endblock %}
