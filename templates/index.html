<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Пресек | Вашиот Дневен Преглед</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f8f9fa;--bg-card:#ffffff;--bg-hover:#f1f3f5;
      --border:#dee2e6;--border-dark:#ced4da;
      --text:#212529;--text-body:#495057;--text-muted:#868e96;
      --headline:#212529;--headline-hov:#1c7ed6;
      --red:#d63031;--red-light:#ff7675;--accent:#ffca28;--accent-dark:#ffb300;
      --cat-bg:#212529;--cat-text:#f8f9fa;
      --badge-bg:#e9ecef;--badge-text:#495057;
      --serif:'Source Serif 4','Noto Serif',Georgia,serif;
      --display:'Playfair Display',Georgia,serif;
      --sans:'Noto Sans',sans-serif;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#121212;--bg-card:#1e1e1e;--bg-hover:#2d2d2d;
      --border:#333333;--border-dark:#444444;
      --text:#e0e0e0;--text-body:#b0b0b0;--text-muted:#9e9e9e;
      --headline:#f5f5f5;--headline-hov:#ffca28;
      --red:#ff5252;--red-light:#ff8a80;--accent:#ffca28;--accent-dark:#ffb300;
      --cat-bg:#0a0a0a;--cat-text:#e0e0e0;
      --badge-bg:#2d2d2d;--badge-text:#9e9e9e;
    }}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{background:var(--bg);color:var(--text-body);font-family:var(--serif);font-size:17px;line-height:1.6;min-height:100vh;overflow-x:hidden}

    /* TICKER */
    .ticker-bar{background:var(--bg-card);border-bottom:1px solid var(--border);height:32px;display:flex;align-items:center;overflow:hidden}
    .ticker-label{background:var(--red);color:#fff;font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:0 .85rem;height:100%;display:flex;align-items:center;white-space:nowrap;flex-shrink:0;font-family:var(--sans)}
    .ticker-track{flex:1;overflow:hidden}
    .ticker-inner{display:flex;gap:2.5rem;white-space:nowrap;animation:ticker 60s linear infinite;font-size:.8rem;color:var(--text-muted);font-family:var(--serif)}
    .ticker-item::before{content:'◆ ';color:var(--accent);opacity:.8;font-size:.5rem;vertical-align:middle}
    @keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

    /* HEADER & SEARCH */
    .site-header{background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
    .header-inner{display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;max-width:1400px;margin:0 auto;height:64px;position:relative}
    .logo-text{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.8rem;font-weight:900;color:var(--headline);text-decoration:none;transition:opacity .2s}
    .logo-text.hidden{opacity:0;pointer-events:none}
    .header-date{font-size:.85rem;color:var(--text-muted);font-family:var(--sans);font-weight:600;flex:1;text-align:center;transition:opacity .2s}
    .header-date.hidden{opacity:0}
    .header-right{display:flex;align-items:center;gap:.75rem}
    .search-toggle{background:none;border:none;color:var(--text);font-size:1.4rem;cursor:pointer;padding:.4rem;display:flex;align-items:center}
    .top20-btn{background:var(--accent);color:#121212;border:none;font-family:var(--sans);font-size:.8rem;font-weight:700;padding:.5rem 1rem;border-radius:6px;cursor:pointer}
    .refresh-btn{background:var(--bg);color:var(--text);border:1px solid var(--border);width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer}
    
    .search-overlay{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--bg-card);display:none;align-items:center;padding:0 1.25rem;gap:1rem;z-index:210}
    .search-overlay.active{display:flex}
    .search-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.6rem 1rem;font-family:var(--sans);font-size:1rem;color:var(--text);outline:none}
    .search-input:focus{border-color:var(--accent)}
    .search-close{background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;padding:.4rem}

    /* CAT NAV */
    .cat-nav{background:var(--bg-card);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:64px;z-index:190;scrollbar-width:none}
    .cat-nav::-webkit-scrollbar{display:none}
    .cat-nav-inner{display:flex;max-width:1400px;margin:0 auto;padding:0 .5rem}
    .cat-btn{font-family:var(--sans);font-size:.8rem;font-weight:700;color:var(--text-muted);background:none;border:none;border-bottom:3px solid transparent;padding:.8rem 1rem;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
    .cat-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

    /* TRENDS */
    .trending-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:.5rem 0}
    .trending-inner{display:flex;align-items:center;gap:.75rem;padding:0 1.25rem;max-width:1400px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
    .trending-inner::-webkit-scrollbar{display:none}
    .trend-chip{font-size:.75rem;font-weight:600;color:var(--text-muted);background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:.2rem .8rem;white-space:nowrap;cursor:pointer;transition:all .15s}
    .trend-chip:hover{border-color:var(--accent);color:var(--accent)}

    /* MAIN LAYOUT */
    .site-layout{display:flex;max-width:1400px;margin:0 auto;gap:1.5rem;padding:1rem 1.25rem 3rem}
    .site-main{flex:1;min-width:0}
    .site-sidebar{width:300px;flex-shrink:0;display:none}
    @media(min-width:1024px){.site-sidebar{display:block;position:sticky;top:130px;align-self:flex-start}}

    /* CARDS */
    .stories-grid{display:grid;grid-template-columns:1fr;gap:1.25rem}
    @media(min-width:768px){.stories-grid{grid-template-columns:1fr 1fr}}
    .story-card{background:var(--bg-card);border-radius:12px;padding:1.25rem;border:1px solid var(--border);display:flex;flex-direction:column;gap:.75rem;transition:all .2s ease}
    .story-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
    .story-card-top{display:flex;gap:1rem;justify-content:space-between}
    .story-content{flex:1;min-width:0}
    .story-meta{display:flex;align-items:center;gap:.5rem;font-family:var(--sans);font-size:.75rem;font-weight:700;color:var(--text-muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.02em}
    .story-source{color:var(--text)}
    .story-time::before{content:'·';margin-right:.5rem}
    .story-headline{font-family:var(--serif);font-size:1.2rem;font-weight:700;line-height:1.3;margin:0}
    .story-headline a{color:var(--headline);text-decoration:none}
    .story-headline a:hover{color:var(--accent)}
    .story-thumb-wrap{width:100px;height:70px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--bg)}
    .story-thumb{width:100%;height:100%;object-fit:cover}
    .story-excerpt{font-size:.95rem;color:var(--text-body);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    
    .related-links{border-top:1px solid var(--border);padding-top:.75rem;display:flex;flex-direction:column;gap:.4rem}
    .related-item{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--text-muted);text-decoration:none}
    .related-item:hover{color:var(--accent)}
    .related-dot{width:4px;height:4px;background:var(--border-dark);border-radius:50%}
    .related-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .related-src{font-size:.7rem;font-weight:700;opacity:.7}

    .actions-row{margin-top:auto;padding-top:.75rem;display:flex;align-items:center;gap:.75rem}
    .badge-count{background:var(--badge-bg);color:var(--badge-text);font-family:var(--sans);font-size:.75rem;font-weight:700;padding:.2rem .6rem;border-radius:4px}
    .ai-btn{background:none;border:1px solid var(--border);color:var(--text-muted);font-family:var(--sans);font-size:.75rem;font-weight:700;padding:.2rem .6rem;border-radius:4px;cursor:pointer;transition:all .15s}
    .ai-btn:hover{border-color:var(--accent);color:var(--accent)}
    .ai-panel{display:none;margin-top:.75rem;padding:.75rem;background:var(--bg);border-left:3px solid var(--accent);border-radius:0 4px 4px 0;font-size:.9rem}
    .ai-panel.active{display:block}

    .loading-wrap{text-align:center;padding:4rem 1rem;color:var(--text-muted)}
    .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    
    footer{background:var(--bg-card);border-top:1px solid var(--border);padding:2rem 1.25rem;text-align:center;color:var(--text-muted);font-size:.85rem}
    .footer-links{display:flex;justify-content:center;gap:1rem;margin-top:1rem;flex-wrap:wrap}
    .footer-links a{color:var(--text-muted);text-decoration:none}
    .footer-links a:hover{color:var(--accent)}
    
    @media(max-width:767px){
      .header-inner{height:56px;padding:0 .75rem}
      .logo-text{font-size:1.5rem}
      .header-date{display:none}
      .cat-nav{top:56px}
      .story-card{padding:1rem}
      .story-headline{font-size:1.05rem}
      .story-thumb-wrap{width:80px;height:60px}
    }
  </style>
</head>
<body>

<div class="ticker-bar"><div class="ticker-label">◉ Живо</div><div class="ticker-track"><div class="ticker-inner" id="tickerInner"></div></div></div>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo-text" id="logoText">
      <svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="6" fill="var(--red)"/>
        <text x="16" y="24" font-family="Georgia, serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">П</text>
      </svg>
      <span>ПРЕСЕК</span>
    </a>
    <div class="header-date" id="headerDate"></div>
    <div class="header-right" id="headerRight">
      <button class="search-toggle" onclick="toggleSearch(true)">⌕</button>
      <button class="top20-btn" onclick="showTop20(this)">Топ 20</button>
      <button class="refresh-btn" id="refreshBtn" onclick="fetchNews()">↻</button>
    </div>
    <div class="search-overlay" id="searchOverlay">
      <input type="text" class="search-input" id="searchInput" placeholder="Пребарај вести…" oninput="liveSearch(this.value)" onkeydown="if(event.key==='Enter') toggleSearch(false)">
      <button class="search-close" onclick="toggleSearch(false)">✕</button>
    </div>
  </div>
</header>

<nav class="cat-nav"><div class="cat-nav-inner" id="catNav"></div></nav>
<div class="trending-bar"><div class="trending-inner" id="trendChips"></div></div>

<div class="site-layout">
  <main class="site-main">
    <div id="pageWrap">
      <div class="loading-wrap"><div class="spinner"></div>Вчитување…</div>
    </div>
    <div id="loadMoreWrap" style="display:none; text-align:center; padding:2rem">
      <button class="top20-btn" style="padding:.8rem 2rem" onclick="loadMore()">Вчитај повеќе ↓</button>
    </div>
  </main>
  <aside class="site-sidebar">
    <div class="sidebar-section" style="background:var(--bg-card); padding:1rem; border-radius:12px; border:1px solid var(--border)">
      <h4 style="margin-bottom:1rem; font-family:var(--display); font-size:1.1rem">🔥 Најчитано</h4>
      <div id="sidebarPopular"></div>
    </div>
  </aside>
</div>

<footer>
  <strong style="font-family:var(--display); font-size:1.2rem; color:var(--headline)">ПРЕСЕК</strong>
  <p style="margin-top:.5rem">Вашиот дневен преглед на македонски вести</p>
  <div class="footer-links">
    <a href="/izvori">Извори</a> · <a href="/stats">Статистики</a> · <a href="/about">За нас</a> · <a href="/privacy">Приватност</a>
  </div>
</footer>

<script>
  let allClusters = [];
  let activeCategory = 'Сите';
  let _currentPage = 0;
  let _hasMore = false;
  const PAGE_SIZE = 50;

  function timeAgo(str) {
    if(!str) return '';
    const diff = (Date.now() - new Date(str)) / 1000;
    if(diff < 60) return 'сега';
    if(diff < 3600) return `${Math.floor(diff/60)}м`;
    if(diff < 86400) return `${Math.floor(diff/3600)}ч`;
    return `${Math.floor(diff/86400)}д`;
  }

  function toggleSearch(show) {
    const overlay = document.getElementById('searchOverlay');
    const input = document.getElementById('searchInput');
    overlay.classList.toggle('active', show);
    if(show) {
      input.focus();
    } else if(input.value) {
      input.value = '';
      liveSearch('');
    }
  }

  function toggleAI(id, btn) {
    const panel = document.getElementById(`ai-${id}`);
    const isVisible = panel.classList.toggle('active');
    btn.textContent = isVisible ? 'Затвори' : 'AI Анализа';
    if(isVisible && !panel.dataset.loaded) {
      panel.textContent = 'Анализирање…';
      fetch(`/api/summary/${id}`).then(r => r.json()).then(data => {
        panel.textContent = data.summary || 'Нема достапна анализа.';
        panel.dataset.loaded = "true";
      }).catch(() => { panel.textContent = 'Грешка при анализа.'; });
    }
  }

  function renderCard(c) {
    const a = c.articles[0];
    if(!a) return '';
    const related = c.articles.slice(1, 4);
    const isBreaking = (c.score || 0) > 3.0;

    return `
      <div class="story-card">
        <div class="story-card-top">
          <div class="story-content">
            <div class="story-meta">
              <span class="story-source">${a.source}</span>
              <span class="story-time">${timeAgo(a.created_at)}</span>
              ${isBreaking ? '<span style="color:var(--red)">· ВО ЖИВО</span>' : ''}
            </div>
            <h3 class="story-headline">
              <a href="/cluster/${c.cluster_id}">${a.headline || a.title}</a>
            </h3>
          </div>
          ${a.image_url ? `
            <div class="story-thumb-wrap">
              <img src="${a.image_url}" class="story-thumb" loading="lazy">
            </div>
          ` : ''}
        </div>
        ${a.description ? `<p class="story-excerpt">${a.description}</p>` : ''}
        ${related.length ? `
          <div class="related-links">
            ${related.map(r => `
              <a href="${r.link}" target="_blank" class="related-item">
                <span class="related-dot"></span>
                <span class="related-text">${r.title}</span>
                <span class="related-src">${r.source}</span>
              </a>
            `).join('')}
          </div>
        ` : ''}
        <div class="actions-row">
          <span class="badge-count">${c.articles.length} извори</span>
          <button class="ai-btn" onclick="toggleAI('${c.cluster_id}', this)">AI Анализа</button>
        </div>
        <div class="ai-panel" id="ai-${c.cluster_id}"></div>
      </div>
    `;
  }

  function renderPage(clusters) {
    const wrap = document.getElementById('pageWrap');
    let filtered = clusters;
    if(activeCategory !== 'Сите') {
      filtered = clusters.filter(c => c.articles[0]?.category === activeCategory);
    }
    if(!filtered.length) {
      wrap.innerHTML = '<div style="text-align:center; padding:3rem; opacity:0.5">Нема вести во оваа категорија.</div>';
      return;
    }
    wrap.innerHTML = `<div class="stories-grid">${filtered.map(renderCard).join('')}</div>`;
  }

  async function fetchNews() {
    const btn = document.getElementById('refreshBtn');
    btn.style.opacity = '0.5';
    try {
      const res = await fetch(`/api/news?page=0&page_size=${PAGE_SIZE}`);
      const data = await res.json();
      allClusters = data.clusters || data;
      _hasMore = data.has_more;
      renderPage(allClusters);
      updateTicker(allClusters);
      buildCats(allClusters);
      document.getElementById('loadMoreWrap').style.display = _hasMore ? 'block' : 'none';
    } catch(e) {}
    btn.style.opacity = '1';
  }

  async function loadMore() {
    _currentPage++;
    try {
      const res = await fetch(`/api/news?page=${_currentPage}&page_size=${PAGE_SIZE}`);
      const data = await res.json();
      const nc = data.clusters || [];
      allClusters = [...allClusters, ...nc];
      _hasMore = data.has_more;
      renderPage(allClusters);
      document.getElementById('loadMoreWrap').style.display = _hasMore ? 'block' : 'none';
    } catch(e) {}
  }

  function liveSearch(q) {
    const lower = q.toLowerCase();
    const cards = document.querySelectorAll('.story-card');
    cards.forEach(card => {
      card.style.display = card.innerText.toLowerCase().includes(lower) ? 'flex' : 'none';
    });
  }

  function updateTicker(clusters) {
    const items = clusters.slice(0, 15).map(c => `<span class="ticker-item">${c.articles[0]?.title}</span>`);
    document.getElementById('tickerInner').innerHTML = [...items, ...items].join('');
  }

  function buildCats() {
    const cats = ['Сите', 'Македонија', 'Балкан', 'Европа', 'Германија', 'Америка', 'Свет'];
    document.getElementById('catNav').innerHTML = cats.map(c => 
      `<button class="cat-btn ${c===activeCategory?'active':''}" onclick="filterCat('${c}', this)">${c}</button>`
    ).join('');
  }

  function filterCat(cat, btn) {
    activeCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPage(allClusters);
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  async function fetchPopular() {
    try {
      const res = await fetch('/api/popular');
      const data = await res.json();
      document.getElementById('sidebarPopular').innerHTML = data.slice(0, 6).map(c => `
        <div style="margin-bottom:1rem; border-bottom:1px solid var(--border); padding-bottom:0.75rem">
          <a href="/cluster/${c.cluster_id}" style="color:var(--headline); text-decoration:none; font-size:0.95rem; font-weight:600; line-height:1.4; display:block">${c.articles[0].title}</a>
          <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px">${c.articles[0].source} · ${timeAgo(c.articles[0].created_at)}</div>
        </div>
      `).join('');
    } catch(e) {}
  }

  async function fetchTrending() {
    try {
      const res = await fetch('/api/trending');
      const data = await res.json();
      document.getElementById('trendChips').innerHTML = data.slice(0, 10).map(t => `
        <span class="trend-chip" onclick="document.getElementById('searchInput').value='${t.word}'; toggleSearch(true); liveSearch('${t.word}')">#${t.word}</span>
      `).join('');
    } catch(e) {}
  }

  const now = new Date();
  const D = ['Недела','Понеделник','Вторник','Среда','Четврток','Петок','Сабота'];
  const M = ['јануари','февруари','март','април','мај','јуни','јули','август','септември','октомври','ноември','декември'];
  document.getElementById('headerDate').textContent = `${D[now.getDay()]}, ${now.getDate()} ${M[now.getMonth()]}`;

  fetchNews(); fetchPopular(); fetchTrending();
</script>
</body>
</html>
