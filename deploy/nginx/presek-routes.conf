# Image proxy
location ^~ /proxy {
    include /etc/nginx/snippets/presek-security-headers.conf;
    limit_req zone=api_limit burst=20 nodelay;
    proxy_method GET;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_pass http://presek_fastapi/proxy;
    proxy_read_timeout 120s;
}

# Metrics are scraped directly from the local FastAPI bind (127.0.0.1:5001).
location = /metrics {
    deny all;
    return 404;
}

location = /api/metrics {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    include /etc/nginx/snippets/presek-security-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_pass http://presek_fastapi/metrics;
    proxy_read_timeout 30s;
}

location / {
    include /etc/nginx/snippets/presek-security-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_pass http://presek_astro;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
}

location ^~ /api/intelligence/cluster/ {
    include /etc/nginx/snippets/presek-security-headers.conf;
