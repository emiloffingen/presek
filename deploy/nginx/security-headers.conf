add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://jsc.adskeeper.com https://*.adskeeper.com https://*.mgid.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob: https://www.google-analytics.com https://www.googletagmanager.com https://*.adskeeper.com https://*.mgid.com; connect-src 'self' https: wss:; frame-src 'self' https://*.adskeeper.com https://*.mgid.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
