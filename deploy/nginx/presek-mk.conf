server {
    listen 80;
    server_name presek.mk www.presek.mk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name presek.mk www.presek.mk;
    
    ssl_certificate /etc/letsencrypt/live/presek.mk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/presek.mk/privkey.pem;
    
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    
    location /static/ {
        alias /home/emiloffingen/presek-runtime/current/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
