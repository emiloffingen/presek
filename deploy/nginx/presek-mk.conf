upstream presek_astro_mk {
    server 127.0.0.1:3001;
}

upstream presek_fastapi_mk {
    server 127.0.0.1:5002;
}

server {
    listen 80;
    listen [::]:80;
    server_name presek.mk www.presek.mk;

    # Handle Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # For Cloudflare Flexible SSL: proxy directly instead of redirecting
    # to avoid redirect loops when Cloudflare connects on HTTP
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/snippets/presek-security-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    
    location / {
        proxy_pass http://presek_astro_mk;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
    
    location ^~ /api/ {
        proxy_pass http://presek_fastapi_mk;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.presek.mk;

    ssl_certificate /etc/ssl/cloudflare/presek.mk/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare/presek.mk/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Redirect www to non-www
    return 301 https://presek.mk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name presek.mk;

    ssl_certificate /etc/ssl/cloudflare/presek.mk/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare/presek.mk/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/presek-security-headers.conf;
    add_header Cache-Control "no-transform" always;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # MK-specific routes
    location ^~ /proxy {
        include /etc/nginx/snippets/presek-security-headers.conf;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_method GET;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://127.0.0.1:5002/proxy;
        proxy_read_timeout 120s;
    }

    location / {
        include /etc/nginx/snippets/presek-security-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://presek_astro_mk;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/presek-security-headers.conf;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://127.0.0.1:5002;
        proxy_read_timeout 120s;
    }

    location ^~ /static/ {
        include /etc/nginx/snippets/presek-security-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://127.0.0.1:5002;
        expires 1h;
    }

    location ^~ /_astro/ {
        include /etc/nginx/snippets/presek-security-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://presek_astro_mk;
        expires 30d;
    }

    location ^~ /img/ {
        include /etc/nginx/snippets/presek-security-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://presek_astro_mk;
        expires 30d;
    }
}
