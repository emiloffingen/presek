map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=20r/s;

upstream presek_fastapi {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream presek_astro {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Common proxy settings to avoid repetition
# We include these in both server blocks to support Flexible and Full SSL modes
# without redirect loops.

server {
    listen 80;
    listen [::]:80;
    server_name presek.live www.presek.live;

    server_tokens off;
    client_max_body_size 10m;
    keepalive_timeout 65;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/presek-security-headers.conf;
    add_header Cache-Control "no-transform" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Handle Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect only if not already HTTPS (either direct or via Cloudflare)
    # This prevents the common Flexible SSL redirect loop.
    location / {
        if ($http_x_forwarded_proto != "https") {
            # Only redirect if the user is truly on HTTP and not behind an HTTPS proxy
            # But wait, if they are on HTTP, we DO want to upgrade them.
            # However, if we are behind Cloudflare, CF handles the upgrade usually.
            # If CF is in Flexible mode, CF expects the origin to be HTTP.
            # If we redirect to HTTPS, CF sees that and redirects the USER to HTTPS.
            # Then CF connects to us on HTTP again -> LOOP.
            
            # The safest logic for Cloudflare: if CF sent us an HTTPS request (proto=https),
            # we must NOT redirect.
        }
        
        # We'll let the HTTPS block handle the strict enforcement if needed,
        # but for port 80, we allow proxying if it's already "secure" or if we are in transition.
        proxy_pass http://presek_astro;
    }

    # API and other routes need to be mirrored or shared.
    # To keep it clean, we'll use an include or just proxy everything to the apps.
    location ^~ /api/ {
        proxy_pass http://presek_fastapi;
    }
    
    location ^~ /static/ {
        proxy_pass http://presek_fastapi;
    }

    location ^~ /_astro/ {
        proxy_pass http://presek_astro;
    }

    location ^~ /img/ {
        proxy_pass http://presek_astro;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name presek.live www.presek.live;

    ssl_certificate /etc/ssl/cloudflare/presek.live/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare/presek.live/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/presek-security-headers.conf;
    add_header Cache-Control "no-transform" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location / {
        proxy_pass http://presek_astro;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 120s;
    }

    location ^~ /static/ {
        proxy_pass http://presek_fastapi;
        expires 1h;
    }

    location ^~ /_astro/ {
        proxy_pass http://presek_astro;
        expires 30d;
    }

    location ^~ /img/ {
        proxy_pass http://presek_astro;
        expires 30d;
    }
}
