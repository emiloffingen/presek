map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream presek_flask {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream presek_fastapi {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream presek_astro {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name presek.live www.presek.live;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://presek.live$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name presek.live www.presek.live;

    # Replace these with your actual origin certificate paths.
    ssl_certificate /etc/ssl/cloudflare/presek.live/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare/presek.live/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Legacy Flask utility routes kept only for OG image compatibility
    location = /robots.txt {
        proxy_pass http://presek_flask;
    }

    location ^~ /og/ {
        proxy_pass http://presek_flask;
    }

    location = /og-image.svg {
        proxy_pass http://presek_flask;
    }

    location = /sw.js {
        proxy_pass http://presek_fastapi;
    }

    location = /manifest.json {
        proxy_pass http://presek_fastapi;
    }

    location = /proxy {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 60s;
    }

    location ^~ /static/ {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 60s;
    }

    location ^~ /api/intelligence/ {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 60s;
    }

    location = /api/chat/stream {
        proxy_pass http://presek_fastapi;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /api/live {
        proxy_pass http://presek_fastapi;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /api/chat_cluster {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 120s;
    }

    location = /api/weather {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 60s;
    }

    # FastAPI is the primary public API backend.
    location ^~ /api/ {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 120s;
    }

    # Public site
    location / {
        proxy_pass http://presek_astro;
        proxy_read_timeout 60s;
    }
}
