map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=20r/s;

upstream presek_fastapi {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream presek_astro {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name presek.live www.presek.live;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://presek.live$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name presek.live www.presek.live;

    # Replace these with your actual origin certificate paths.
    ssl_certificate /etc/ssl/cloudflare/presek.live/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare/presek.live/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    server_tokens off;
    client_max_body_size 10m;
    keepalive_timeout 65;

    include /etc/nginx/snippets/presek-security-headers.conf;
    add_header Cache-Control "no-transform" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Public utility routes
    location = /robots.txt {
        proxy_pass http://presek_fastapi;
    }

    location ^~ /og/ {
        proxy_pass http://presek_fastapi;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 15m;
        add_header Cache-Control "public, max-age=900" always;
    }

    location = /og-image.svg {
        proxy_pass http://presek_fastapi;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 15m;
        add_header Cache-Control "public, max-age=900" always;
    }

    location = /sw.js {
        proxy_pass http://presek_fastapi;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 5m;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /manifest.json {
        proxy_pass http://presek_fastapi;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /proxy {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 60s;
    }

    location ^~ /static/ {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ^~ /_astro/ {
        proxy_pass http://presek_astro;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /logo.svg {
        proxy_pass http://presek_astro;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ^~ /img/ {
        proxy_pass http://presek_astro;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ^~ /api/intelligence/ {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 60s;
    }

    location = /api/chat/stream {
        proxy_pass http://presek_fastapi;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /api/live {
        proxy_pass http://presek_fastapi;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /api/chat_cluster {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 120s;
    }

    location = /api/weather {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 60s;
    }

    # FastAPI is the primary public API backend.
    # API backend.
    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 120s;
    }

    # Public site
    location / {
        limit_req zone=web_limit burst=40 nodelay;
        proxy_pass http://presek_astro;
        proxy_read_timeout 60s;
    }
