map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Rate limiting zones (required by presek-routes.conf)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=20r/s;

upstream presek_fastapi {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream presek_astro {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name presek.live www.presek.live;

    # Handle Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Include shared routes (handles Cloudflare Flexible SSL)
    include /etc/nginx/snippets/presek-routes.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.presek.live;

    ssl_certificate /etc/ssl/cloudflare/presek.live/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare/presek.live/privkey.pem;

    # Redirect www to non-www
    location / {
        return 301 $scheme://presek.live$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name presek.live;

    ssl_certificate /etc/ssl/cloudflare/presek.live/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare/presek.live/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/presek-security-headers.conf;
    add_header Cache-Control "no-transform" always;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Include shared routes
    include /etc/nginx/snippets/presek-routes.conf;
}
