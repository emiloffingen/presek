map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Rate limit zones: see deploy/nginx/rate-limit-zones.conf (installed into nginx.conf http block).

upstream presek_fastapi {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream presek_astro {
    server [::1]:4321;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name presek.live www.presek.live;

    server_tokens off;
    client_max_body_size 10m;
    keepalive_timeout 65;

    include /etc/nginx/snippets/presek-security-headers.conf;
    add_header Cache-Control "no-transform" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Public utility routes
    location = /robots.txt {
        proxy_pass http://presek_fastapi;
    }

    location ^~ /og/ {
        proxy_pass http://presek_fastapi;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 15m;
        add_header Cache-Control "public, max-age=900" always;
    }

    location = /og-image.svg {
        proxy_pass http://presek_fastapi;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 15m;
        add_header Cache-Control "public, max-age=900" always;
    }

    location = /sw.js {
        proxy_pass http://presek_fastapi;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 5m;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /manifest.json {
        proxy_pass http://presek_fastapi;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /proxy {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 60s;
    }

    location ^~ /static/ {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ^~ /_astro/ {
        proxy_pass http://presek_astro;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /logo.svg {
        proxy_pass http://presek_astro;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ^~ /img/ {
        proxy_pass http://presek_astro;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/presek-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ^~ /api/intelligence/cluster/ {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 180s;
    }

    location ^~ /api/intelligence/ {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 120s;
    }

    location = /api/live {
        proxy_pass http://presek_fastapi;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /api/weather {
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 60s;
    }

    # FastAPI is the primary public API backend.
    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://presek_fastapi;
        proxy_read_timeout 120s;
    }

    # Public site
    location / {
        limit_req zone=web_limit burst=40 nodelay;
        proxy_pass http://presek_astro;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
