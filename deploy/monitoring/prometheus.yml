# Prometheus configuration for Presek monitoring
# Save this as /etc/prometheus/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Rule files
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Presek API metrics (local FastAPI bind only)
  - job_name: "presek-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:5001"]
    scheme: http
    scrape_interval: 10s
    scrape_timeout: 5s

  # Node Exporter for server metrics
  - job_name: "node-exporter"
    static_configs:
      - targets: ["localhost:9100"]
    scrape_interval: 15s

  # PostgreSQL metrics
  - job_name: "postgresql"
    static_configs:
      - targets: ["localhost:9187"]
    scrape_interval: 15s

  # Redis metrics
  - job_name: "redis"
    static_configs:
      - targets: ["localhost:9121"]
    scrape_interval: 15s

  # Nginx metrics
  - job_name: "nginx"
    static_configs:
      - targets: ["localhost:9113"]
    scrape_interval: 15s

  # Celery metrics
  - job_name: "celery"
    static_configs:
      - targets: ["localhost:9800"]
    scrape_interval: 15s
