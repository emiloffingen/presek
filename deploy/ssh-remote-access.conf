# presek remote SSH — reach the phone and shield from anywhere (no VPN).
#
# Requires `cloudflared` installed on the machine you're connecting FROM:
#   https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/
#   macOS:   brew install cloudflared
#   Debian:  see the docs link above
#   Termux:  pkg install cloudflared
#
# Usage:  ssh phone    /  ssh shield    /  ssh tablet
# Copy the Host blocks below into ~/.ssh/config and set IdentityFile.

Host phone
    HostName ssh-phone.presek.mk
    User u0_a106
    Port 8022
    ProxyCommand cloudflared access ssh --hostname %h
    IdentityFile ~/.ssh/termux_test
    StrictHostKeyChecking accept-new

Host shield
    HostName ssh-shield.presek.mk
    User u0_a106
    Port 8022
    ProxyCommand cloudflared access ssh --hostname %h
    IdentityFile ~/.ssh/termux_test
    StrictHostKeyChecking accept-new

Host tablet
    HostName ssh-tablet.presek.mk
    User u0_a559
    Port 8022
    ProxyCommand cloudflared access ssh --hostname %h
    IdentityFile ~/.ssh/termux_test
    StrictHostKeyChecking accept-new

# One-off without config, e.g.:
#   ssh -o ProxyCommand="cloudflared access ssh --hostname %h" \
#       -i ~/.ssh/termux_test u0_a106@ssh-shield.presek.mk
#
# From inside proot (Debian) on the phone/shield, prefix with:
#   proot-distro login debian -- bash -lc "ssh ..."
