[project]
name = "presek"
version = "8.2.3"
description = "News aggregation and analysis platform for Serbian and Macedonian media"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.3",
    "anyio>=4.13.0",
    "bleach>=6.3.0",
    "boto3>=1.43.2",
    "celery>=5.6.2",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "numpy>=1.26.4,<2.0.0",
    "pgvector>=0.4.1",
    "pillow>=11.0.0,<12.0.0",
    "pillow-avif-plugin>=1.5.5",
    "prometheus-client>=0.24.0,<0.25.0",
    "psycopg[binary,pool]>=3.3.3",
    "pydantic>=2.11.0,<2.13.0",
    "python-dotenv>=1.2.2",
    "pywebpush>=2.3.0",
    "redis>=7.4.0,<9.0.0",
    "requests>=2.33.0",
    "sgmllib3k>=1.0.0",
    "trafilatura>=2.0.0",
    "aiohttp>=3.14.1",
    "pyjwt>=2.13.0",
    "cryptography>=44.0.0,<45.0.0",
    "idna>=3.18",
    "sentry-sdk>=2.60.0",
    "stripe>=15.2.1",
    "python-multipart>=0.0.18",
    "click>=8.1.7,<8.1.8",
    "cffi>=1.17.0,<2.0.0",
    "six>=1.16.0,<1.17.0",
    "psutil>=7.1.0,<7.2.0",
    "pygments>=2.18.0,<2.19.0",
    "sqlalchemy>=2.0.36,<2.0.37",
    "tqdm>=4.66.0,<4.68.0",
    "babel>=2.16.0,<2.17.0",
    "humanize>=4.0.0,<5.0.0",
    "feedparser>=6.0.0,<6.1.0",
]

[project.optional-dependencies]
# Legacy pip extras — prefer uv dependency-groups (api/worker) for installs.
api = [
    "fastapi>=0.136.1",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.46.0",
    "gunicorn>=25.3.0",
    "slowapi>=0.1.9",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "sentence-transformers>=5.4.1",
    "fasttext>=0.9.3",
]
worker = [
    "torch>=2.11.0",
    "spacy>=3.8.13",
    "xx-ent-wiki-sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl",
    "keybert>=0.9.0",
    "llama-cpp-python>=0.3.22",
    "playwright>=1.59.0",
    "edge-tts>=7.2.3",
    "gTTS>=2.5.4",
    "omnivoice>=0.1.5",
    "numba>=0.60.0",
]
Dev = [
    "pre-commit==4.0.0",
    "black>=26.3.1",
    "isort==5.13.2",
    "flake8==7.1.1",
    "mypy==1.11.2",
    "codespell==2.3.0",
    "detect-secrets==1.5.0",
    "shellcheck-py==0.10.0.1",
]

[dependency-groups]
api = [
    "fastapi>=0.136.1",
    "starlette>=1.3.1",
    "uvicorn>=0.46.0",
    "gunicorn>=25.3.0",
    "slowapi>=0.1.9",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "sentence-transformers>=5.4.1",
    "fasttext>=0.9.3",
]
worker = [
    "torch>=2.11.0",
    "spacy>=3.8.13",
    "xx-ent-wiki-sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl",
    "keybert>=0.9.0",
    "llama-cpp-python>=0.3.22",
    "playwright>=1.59.0",
    "edge-tts>=7.2.3",
    "gTTS>=2.5.4",
    "omnivoice>=0.1.5",
    "numba>=0.60.0",
]
dev = [
    "black>=26.3.1",
    "mypy>=1.11.2",
    "pip-audit>=2.9.0",
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
default-groups = ["api", "worker"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# These modules do sys.path.insert() or env setup before project imports — intentional pattern
"core/*.py" = ["E402"]
"routes/*.py" = ["E402"]
"nlp/*.py" = ["E402"]
"tasks/*.py" = ["E402"]
"migrations/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/test_optimization.py" = ["E402"]
