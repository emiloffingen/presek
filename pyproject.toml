[project]
name = "presek"
version = "8.3.8"
description = "Macedonian news aggregation platform with minimal local AI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.3",
    "anyio>=4.13.0",
    "bleach>=6.4.0",
    "boto3>=1.43.2",
    "brotli>=1.2.0",
    "celery>=5.6.2",
    "feedparser>=6.0.12,<6.1.0",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
    "pillow-avif-plugin>=1.5.5",
    "prometheus-client>=0.24.0,<0.25.0",
    "psycopg[binary,pool]>=3.3.3",
    "pydantic>=2.11.0,<2.13.0",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0,<9.0.0",
    "requests>=2.33.0",
    "sgmllib3k>=1.0.0",
    "trafilatura>=2.0.0",
    "aiohttp>=3.14.3",
    "edge-tts>=7.2.8",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    "idna>=3.18",
    "sentry-sdk>=2.60.0",
    "stripe>=15.2.1",
    "python-multipart>=0.0.31",
    "click>=8.1.7,<8.1.8",
    "cffi>=1.17.0",
    "six>=1.16.0,<1.17.0",
    "psutil>=7.1.0,<7.2.0",
    "pygments>=2.20.0",
    "sqlalchemy>=2.0.36,<2.0.37",
    "tqdm>=4.66.0,<4.68.0",
    "babel>=2.16.0,<2.17.0",
    "humanize>=4.0.0,<5.0.0",
    # Imported directly (crawler, Celery config); previously only present transitively.
    "justext>=3.0.2",
    # Local multilingual embeddings (core/embeddings.py); replaces the paid Jina API.
    "fastembed>=0.8.1",
    "lxml>=6.1.1",
    "kombu>=5.6.2",
    "billiard>=4.2.4",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.136.1",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.46.0",
    "gunicorn>=25.3.0",
    "slowapi>=0.1.9",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
worker = [
    "llama-cpp-python>=0.3.22",
]
dev = [
    "bandit>=1.9.0",
    "black>=26.3.1",
    "mypy>=1.11.2",
    "pip-audit>=2.9.0",
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
    "pytest-asyncio>=0.23.0",
]

[dependency-groups]
api = [
    "fastapi>=0.136.1",
    "starlette>=1.3.1",
    "uvicorn>=0.46.0",
    "gunicorn>=25.3.0",
    "slowapi>=0.1.9",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
worker = [
    "llama-cpp-python>=0.3.22",
]
dev = [
    "bandit>=1.9.0",
    "black>=26.3.1",
    "mypy>=1.11.2",
    "pip-audit>=2.9.0",
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
# `worker` (llama-cpp-python) is intentionally NOT a default group. The MK
# deployment uses the hosted AI cascade, not local Gemma, and llama-cpp-python
# cannot be built on the Android/proot hosts (hardlink + C++ toolchain limits).
# Install it explicitly where needed: `uv sync --group worker`.
default-groups = ["api"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# These modules do sys.path.insert() or env setup before project imports — intentional pattern
"core/*.py" = ["E402"]
"routes/*.py" = ["E402"]
"nlp/*.py" = ["E402"]
"tasks/*.py" = ["E402"]
"migrations/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
# tasks/intelligence stubs re-export shared constants via `from ... import *`
"tasks/intelligence/_queue.py" = ["F403", "F405"]
"tasks/intelligence/backfill.py" = ["F403", "F405"]
"tasks/intelligence/metadata.py" = ["F403", "F405"]
"tasks/intelligence/style.py" = ["F403", "F405"]
"tasks/intelligence/summarization.py" = ["F403", "F405"]
