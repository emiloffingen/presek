<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle editorial texture (darkest gray) -->
  <rect width="512" height="512" rx="112" fill="#0F1113"/>
  
  <!-- Subtle inner glow for depth -->
  <rect x="24" y="24" width="464" height="464" rx="88" stroke="white" stroke-opacity="0.05" stroke-width="2"/>

  <!-- The "П" (Cyrillic P for Presek) -->
  <!-- Designed with high-contrast editorial serifs -->
  <path d="M140 160V380M140 180H372M372 160V380" stroke="#E63946" stroke-width="48" stroke-linecap="square"/>
  
  <!-- Stylized "Cut" (Presek) element -->
  <path d="M120 220L392 140" stroke="#0F1113" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Accent dot - symbolizing the "focus" or "point" of the news -->
  <circle cx="372" cy="380" r="28" fill="#E63946"/>
</svg>