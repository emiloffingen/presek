<svg width="500" height="120" viewBox="0 0 500 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Authoritative Broadsheet Masthead for ПРЕСЕК -->
  <g fill="#111827">
    <!-- Main Masthead Text -->
    <text x="250" y="70" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="72" letter-spacing="-1" text-anchor="middle">ПРЕСЕК</text>
    
    <!-- Double Rule Line (Classic Newspaper) -->
    <line x1="50" y1="85" x2="450" y2="85" stroke="#111827" stroke-width="2" />
    <line x1="50" y1="89" x2="450" y2="89" stroke="#111827" stroke-width="1" />
    
    <!-- Subtitle -->
    <text x="250" y="105" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="10" letter-spacing="5" text-anchor="middle">ИНФОРМАТИВЕН ДИГИТАЛЕН АГРЕГАТОР</text>
  </g>
</svg>
