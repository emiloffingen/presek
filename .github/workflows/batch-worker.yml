name: Batch worker

# Runs one ingestion + synthesis cycle (scripts/batch_worker.py) on a schedule,
# replacing the always-on Celery worker/beat on the phone/Shield. Celery runs in
# eager mode; Redis is a throwaway service container (locks/caches only), and
# all durable state lives in the primary Postgres (Supabase).
#
# Repo secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL               required - the primary Postgres DSN.
#   GEMINI_API_KEY, GEMINI2_API_KEY, GEMINI3_API_KEY, GROQ_API_KEY,
#   OPENROUTER_API_KEY, NVIDIA_API_KEY, JINA_API_KEY
#                              AI/crawl providers; unset ones are skipped by the
#                              PROVIDER_FALLBACK_ORDER chain.
#   HEALTHCHECK_WORKER_URL     optional - healthchecks.io ping URL (dead-man's switch).
#   TELEGRAM_BOT_TOKEN         optional - failure alerts.
#   TELEGRAM_CHAT_ID           optional - failure alerts.
#
# Private-repo budget: ~2000 Actions minutes/month, shared with offload-backfill.yml.
# 3h cadence + 6-minute budget + hybrid (BATCH_CORE=0) is ~240 runs x ~7 billed
# minutes ~= 1700 min/mo. Adjust cron, budget and BATCH_SLOT_HOURS together.
#
# The schedule only fires from the default branch (main); manual runs work from
# any branch that has this file.

on:
  # PAUSED (manual-only) while the rotating groups are validated. Re-enable
  # (uncomment schedule) once groups 0-3 all complete within budget.
  # schedule:
  #   - cron: "17 */3 * * *"      # every 3h; keep in sync with BATCH_SLOT_HOURS=3
  workflow_dispatch:
    inputs:
      budget:
        description: "Step budget in minutes"
        default: "6"
      group:
        description: "Force rotation group 0-3 (optional)"
        default: ""
      only:
        description: "Run only these steps (space-separated, optional)"
        default: ""

concurrency:
  group: batch-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_WORKER_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: |
            .cache/fastembed
            .cache/huggingface
          key: embed-e5-small-${{ runner.os }}-v1

      - name: Preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set"
            exit 1
          fi

      - name: healthchecks start
        if: ${{ env.HEALTHCHECK_URL != '' }}
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL/start" || true

      - name: Run cycle
        env:
          ENV: production
          LOG_LEVEL: INFO
          SECRET_KEY: ci-worker-${{ github.run_id }}
          # Production import guards (routes.security, core.auth, core.admin_tokens);
          # the worker serves no HTTP, so per-run values are enough.
          CSRF_TOKEN_SECRET: ci-worker-${{ github.run_id }}
          JWT_SECRET: ci-worker-${{ github.run_id }}
          ADMIN_TOKEN_SECRET: ci-worker-${{ github.run_id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: redis://localhost:6379/0
          PUBLIC_SITE_URL: https://presek.mk
          # Mirrors the production .env runtime flags.
          MK_ONLY: "true"
          FULLTEXT_ENABLED: "true"
          FULLTEXT_MAX_CHARS: "20000"
          SYNTHESIS_PROFILE: balanced
          FREE_API_KEYS_ENABLED: "false"
          LOCAL_SYNTHESIS_PREFER_LOCAL: "true"
          SYNTHESIS_LOCAL_ONLY: "false"
          LOCAL_TRANSLATION_ENABLED: "false"
          ENABLE_EXPENSIVE_STYLE_TASKS: "false"
          HOMEPAGE_SYNTHESIS_ONLY: "false"
          ENABLE_AI_SCHEDULES: "false"
          PRESEK_AI_ENABLED: "1"
          LOCAL_MODEL_CONTEXT: "2048"
          LOCAL_MODEL_MAX_PROMPT_CHARS: "4000"
          BOT_USER_AGENT: "PresekBot/1.0 (+https://presek.mk/bot; bot@presek.mk)"
          PROVIDER_FALLBACK_ORDER: gemini2,gemini,groq,openrouter,cerebras,nvidia,mistral,mistral2,local
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI2_MODEL: gemini-flash-lite-latest
          GEMINI3_MODEL: gemini-3.5-flash-lite
          GROQ_MODEL: openai/gpt-oss-120b
          OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          NVIDIA_MODEL: nvidia/nemotron-3-super-120b-a12b
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
          GEMINI3_API_KEY: ${{ secrets.GEMINI3_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          BATCH_BUDGET_MINUTES: ${{ github.event.inputs.budget || '6' }}
          BATCH_SLOT_HOURS: "3"
          BATCH_CORE: "0"            # hybrid: phone keeps ingest/crawl/embed
          BATCH_GROUP: ${{ github.event.inputs.group }}
          ONLY_STEPS: ${{ github.event.inputs.only }}
        run: |
          ARGS=""
          [ -n "$BATCH_GROUP" ] && ARGS="$ARGS --group $BATCH_GROUP"
          [ -n "$ONLY_STEPS" ] && ARGS="$ARGS --only $ONLY_STEPS"
          uv run python scripts/batch_worker.py $ARGS

      - name: healthchecks success
        if: ${{ success() && env.HEALTHCHECK_URL != '' }}
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL" || true

      - name: healthchecks failure
        if: ${{ failure() && env.HEALTHCHECK_URL != '' }}
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL/fail" || true

      - name: notify Telegram on failure
        if: ${{ failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: |
          curl -fsS -m 10 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=presek batch-worker FAILED run=${GITHUB_RUN_ID} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
