name: CI/CD

on:
  push:
    branches: [main, simplify/mk-only-minimal-ai]
  pull_request:
    branches: [main, simplify/mk-only-minimal-ai]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: presek
          POSTGRES_PASSWORD: presek_test
          POSTGRES_DB: presek_test
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://presek:presek_test@localhost:5432/presek_test
        run: uv run alembic upgrade head

      - name: Run tests
        env:
          ENV: test
          DATABASE_URL: postgresql://presek:presek_test@localhost:5432/presek_test
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest tests/ --timeout=60 -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npx astro check --minimumSeverity warning

      - name: Run tests
        working-directory: web
        run: node --test 'src/**/*.test.mjs'

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.13
      - name: Install deps
        run: uv sync --group dev
      - name: Bandit scan
        run: uv run bandit -r core/ tasks/ routes/ -ll
      - name: pip-audit
        # Ignored: no fixed release available (transitive ML/CV deps),
        # celery ecosystem caps click below the fixed release, or
        # build-env-only packages (pip/setuptools in the audit venv).
        # anyio CVE-2026-63374/64847/63349 are fixed in 4.14.2; upgrading
        # requires a full lock regeneration that drops undeclared runtime deps,
        # so it is tracked as separate work.
        run: >-
          uv run pip-audit
          --ignore-vuln PYSEC-2026-3804
          --ignore-vuln PYSEC-2026-2447
          --ignore-vuln PYSEC-2026-2132
          --ignore-vuln PYSEC-2026-3721
          --ignore-vuln PYSEC-2026-3447
          --ignore-vuln CVE-2026-63374
          --ignore-vuln CVE-2026-64847
          --ignore-vuln CVE-2026-63349

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.13
      - name: Install deps
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check core/ routes/ tasks/ nlp/ utils/
      - name: Ruff format check
        run: uv run ruff format --check core/ routes/ tasks/ nlp/ utils/
