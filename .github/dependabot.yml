# Weekly dependency updates, grouped so each ecosystem opens at most one
# routine PR a week. Security fixes still arrive as soon as they are published
# once Dependabot alerts are enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # @astrojs/check (astro check in CI) supports TypeScript 5-6 only;
      # under TS 7 it crashes in @astrojs/language-server. Revisit when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
