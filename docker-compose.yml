services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: presek
      POSTGRES_USER: presek
      POSTGRES_PASSWORD: ${DB_PASSWORD:-presek_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presek -d presek"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presek-net

  redis:
    image: redis:alpine
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presek-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn api_fast:app --host 0.0.0.0 --port 5001 --workers 2
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://presek:${DB_PASSWORD:-presek_pass}@db:5432/presek
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_SITE_URL=https://presek.live
    volumes:
      - .:/app
      - static_uploads:/app/static/uploads
      - static_generated:/app/static/generated
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - presek-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A celery_app worker --loglevel=info --concurrency=1 --queues=celery,ingestion,intelligence,delivery,maintenance
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://presek:${DB_PASSWORD:-presek_pass}@db:5432/presek
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_SITE_URL=https://presek.live
    volumes:
      - .:/app
      - static_uploads:/app/static/uploads
      - static_generated:/app/static/generated
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.5'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - presek-net

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A celery_app beat --loglevel=info
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://presek:${DB_PASSWORD:-presek_pass}@db:5432/presek
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_SITE_URL=https://presek.live
    volumes:
      - .:/app
      - static_uploads:/app/static/uploads
      - static_generated:/app/static/generated
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - presek-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - PORT=3000
      - INTERNAL_API_URL=http://api:5001/api
      - PUBLIC_API_URL=/api
      - PUBLIC_SITE_URL=https://presek.live
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      api:
        condition: service_healthy
    networks:
      - presek-net

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - presek-net

volumes:
  postgres_data:
  static_uploads:
  static_generated:

networks:
  presek-net:
    driver: bridge
