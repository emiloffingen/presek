version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: presek
      POSTGRES_USER: presek
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - presek-net
  
  db-replica:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: presek
      POSTGRES_USER: presek
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    command: |
      bash -c '
      echo "primary_host=db" >> /var/lib/postgresql/data/postgresql.conf
      echo "primary_port=5432" >> /var/lib/postgresql/data/postgresql.conf
      echo "hot_standby=on" >> /var/lib/postgresql/data/postgresql.conf
      '
    depends_on:
      - db
    networks:
      - presek-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - presek-net

  api:
    build: .
    command: python api_fast.py
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://presek:${DATABASE_PASSWORD}@db:5432/presek
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - presek-net

  worker:
    build: .
    command: celery -A celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://presek:${DATABASE_PASSWORD}@db:5432/presek
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - presek-net

networks:
  presek-net:
    driver: bridge

volumes:
  postgres_data:
