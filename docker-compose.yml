# Dev-only backend stack — NOT production parity.
# Production uses systemd + nginx (see deploy/MINIMUM_PROD.md).
# This compose file runs FastAPI + Celery + Postgres + Redis for local API/worker development.
# There is no Astro SSR service; use `cd web && npm run dev` separately for the frontend.

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: presek
      POSTGRES_USER: presek
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - presek-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - presek-net

  api:
    build: .
    command: uvicorn core.api_fast:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql://presek:${DATABASE_PASSWORD}@db:5432/presek
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - CSRF_TOKEN_SECRET=${CSRF_TOKEN_SECRET:-dev-csrf-secret}
      - ENV=development
    depends_on:
      - db
      - redis
    networks:
      - presek-net

  worker:
    build: .
    command: celery -A core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://presek:${DATABASE_PASSWORD}@db:5432/presek
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - ENV=development
    depends_on:
      - db
      - redis
    networks:
      - presek-net

networks:
  presek-net:
    driver: bridge

volumes:
  postgres_data:
